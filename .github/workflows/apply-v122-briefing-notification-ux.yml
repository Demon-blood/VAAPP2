name: Verify v1.0.22 Briefing Notification UX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/lib/services/background_service.dart'
      - 'backend/tests/test_v122_briefing_notification_contract.py'
      - 'docs/V1.0.22_BRIEFING_NOTIFICATION_UX.md'
      - '.github/workflows/apply-v122-briefing-notification-ux.yml'

permissions:
  contents: read

concurrency:
  group: verify-v122-briefing-notification-ux
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FLUTTER_VERSION: '3.38.7'

    steps:
      - name: Check out current commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"

          for attempt in 1 2 3 4 5; do
            if GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
              git fetch --no-tags --depth=1 origin "$GITHUB_SHA"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Repository fetch failed after five attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

          git checkout --detach FETCH_HEAD
          rm -f "$RUNNER_TEMP/git-askpass.sh"

      - name: Verify briefing notification source contract
        run: |
          set -euo pipefail

          SOURCE='android/lib/services/background_service.dart'
          TEST='backend/tests/test_v122_briefing_notification_contract.py'
          DOC='docs/V1.0.22_BRIEFING_NOTIFICATION_UX.md'

          test -f "$SOURCE"
          test -f "$TEST"
          test -f "$DOC"

          grep -q 'BigTextStyleInformation' "$SOURCE"
          grep -q '_briefingCollapsedBody' "$SOURCE"
          grep -q '_briefingExpandedBody' "$SOURCE"
          grep -q 'styleInformation: BigTextStyleInformation' "$SOURCE"

          test "$(grep -c 'body: _briefingCollapsedBody(briefingBody)' "$SOURCE")" = "2"
          test "$(grep -c '_briefingNotificationDetails(briefingTitle, briefingBody)' "$SOURCE")" = "2"

      - name: Run v1.0.22 regression contract
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/va-v122-venv"
          source "$RUNNER_TEMP/va-v122-venv/bin/activate"
          python -m pip install --upgrade pip
          pip install pytest
          pytest -q backend/tests/test_v122_briefing_notification_contract.py

      - name: Install Flutter
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter"

          for attempt in 1 2 3 4 5; do
            if git clone --filter=blob:none --depth=1 --branch "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_DIR"; then
              break
            fi
            rm -rf "$FLUTTER_DIR"
            if [ "$attempt" -eq 5 ]; then
              echo "Flutter SDK download failed after five attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" config --no-analytics
          "$FLUTTER_DIR/bin/flutter" --version

      - name: Analyze and test Android
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          cd android
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Verify repository metadata safely
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Decode the full README into a temporary file first.
          # This avoids the previous `base64 --decode | head -n 1` SIGPIPE failure
          # under `set -o pipefail`.
          gh api "repos/${GITHUB_REPOSITORY}/contents/README.md?ref=${GITHUB_SHA}" \
            --jq '.content' | base64 --decode > "$RUNNER_TEMP/README.md"

          README_HEAD="$(sed -n '1p' "$RUNNER_TEMP/README.md")"
          test -n "$README_HEAD"

          {
            echo '## v1.0.22 briefing notification UX verified'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Android long briefing text: expandable"
            echo "- Current + legacy notification paths: covered"
            echo "- Regression contract: passed"
            echo "- Flutter analyze/test: passed"
            echo "- README verification: passed without SIGPIPE"
          } >> "$GITHUB_STEP_SUMMARY"
