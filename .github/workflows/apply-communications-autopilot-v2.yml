name: Apply Communications Autopilot v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-communications-autopilot-v2.yml'

permissions:
  contents: write

concurrency:
  group: apply-communications-autopilot-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FLUTTER_VERSION: '3.38.7'
      INSTALLER_PATH: '.github/workflows/apply-communications-autopilot-v2.yml'
      EXPECTED_BASE: '6a62e390f456a9946c3c57d0677855bd73ddc1a6'
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out installer commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          rm -f "$RUNNER_TEMP/git-askpass.sh"

      - name: Fail closed unless installer is directly on the verified baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE" || {
            echo "Refusing to patch: installer parent is not $EXPECTED_BASE" >&2
            exit 1
          }
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$INSTALLER_PATH"
          test "$(git show HEAD^:backend/app/core/version.py | tr -d '\r')" = $'APP_VERSION = "1.0.5"\nREQUIRED_ANDROID_VERSION = "1.0.5"'

      - name: Apply guarded source patch
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations
          from pathlib import Path
          ROOT = Path.cwd()
          
          def path(name: str) -> Path:
              return ROOT / name
          
          def replace(name: str, old: str, new: str, *, count: int=1) -> None:
              p = path(name)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'Patch guard failed for {name}: expected at least {count}, found {actual}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')
          
          def write(name: str, content: str) -> None:
              p = path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')
          write('backend/app/services/communication_attention.py', 'from __future__ import annotations\n\nimport re\nfrom typing import Any\n\n_HISTORY_PROVIDERS = {"android_sms_history", "android_mms_history", "android_call_log"}\n_OTP_TERMS = (\n    "one-time code", "one time code", "otp", "verification code", "verificatiecode",\n    "beveiligingscode", "security code", "2fa", "auth code", "authentication code",\n    "code de vérification", "code de securite", "code de sécurité", "login code", "sign-in code",\n)\n_FRAUD_TERMS = (\n    "fraud", "fraude", "unauthorized", "unauthorised", "not authorized", "not authorised",\n    "niet door u", "niet door jou", "suspicious transaction", "verdachte transactie",\n    "card stolen", "kaart gestolen", "account compromised", "rekening gehackt",\n    "security breach", "beveiligingsincident", "unknown transaction", "onbekende transactie",\n)\n_FINANCIAL_CONFIRMATION_TERMS = (\n    "payment received", "payment completed", "payment successful", "payment processed", "payment initiated",\n    "betaling ontvangen", "betaling voltooid", "betaling geslaagd", "betaling verwerkt", "betaling gestart",\n    "transfer completed", "transfer successful", "transfer initiated", "transfer received",\n    "overschrijving uitgevoerd", "overschrijving voltooid", "overschrijving gestart", "overschrijving ontvangen",\n    "withdrawal completed", "withdrawal processed", "withdrawal initiated", "withdrawal requested",\n    "opname voltooid", "opname verwerkt", "opname gestart", "cash withdrawal", "geldopname",\n    "purchase confirmed", "transaction completed", "transaction successful", "transactie voltooid", "card payment",\n)\n_ROUTINE_STATUS_TERMS = (\n    "ticket confirmed", "booking confirmed", "reservation confirmed", "appointment confirmed",\n    "afspraak bevestigd", "reservering bevestigd", "bestelling bevestigd", "order confirmed",\n    "shipped", "dispatched", "out for delivery", "delivered", "verzonden", "geleverd",\n    "ready for pickup", "klaar om af te halen", "your receipt", "uw ontvangstbewijs",\n    "ticket is valid", "ticket valid", "geldig tot", "valid until", "expires on", "vervalt op",\n    "your plan expires", "uw bundel vervalt", "information only", "ter informatie",\n)\n_REQUEST_TERMS = (\n    "action required", "actie vereist", "please ", "can you", "could you", "would you", "will you",\n    "reply", "respond", "laat weten", "kun je", "kan je", "kunt u", "wil je", "wilt u", "bevestig",\n    "confirm this", "approve", "goedkeuren", "confirmez", "pouvez-vous", "répondez", "repondez",\n)\n_PROMO_TERMS = (\n    "unsubscribe", "uitschrijven", "afmelden", "stop to opt out", "reply stop", "promo",\n    "promotion", "aanbieding", "korting", "discount", "sale", "% off", "deal", "newsletter", "nieuwsbrief",\n)\n_PAID_SUBSCRIPTION_TERMS = (\n    "renewal", "renews", "renewed", "verlenging", "wordt verlengd", "next charge",\n    "volgende betaling", "billing", "factur", "charged", "in rekening", "monthly",\n    "maandelijks", "annual", "yearly", "jaarlijks", "price", "prijs",\n)\n_AMOUNT_RE = re.compile(r"(?:€|eur\\s*)\\s*\\d|\\d[\\d., ]*\\s*(?:€|eur)\\b", re.I)\n_CODE_RE = re.compile(r"\\b\\d{4,8}\\b")\n\n\ndef _has_any(text: str, terms: tuple[str, ...]) -> bool:\n    return any(term in text for term in terms)\n\n\ndef normalize_communication_attention(payload: Any, decision: dict[str, Any]) -> dict[str, Any]:\n    """Keep protected evidence separate from genuine human work and interruption."""\n    normalized = dict(decision)\n    body = str(getattr(payload, "body", "") or "")\n    lower = body.casefold()\n    provider = str(getattr(payload, "provider", "") or "").casefold()\n    direction = str(getattr(payload, "direction", "incoming") or "incoming").casefold()\n    channel = str(getattr(payload, "channel", "") or "").casefold()\n    event_type = str(getattr(payload, "event_type", "") or "").casefold()\n\n    protected = bool(normalized.get("protected"))\n    action_required = bool(normalized.get("action_required"))\n    interrupt = False\n    reason = str(normalized.get("reasoning_summary") or "")[:500]\n\n    if direction != "incoming" or provider in _HISTORY_PROVIDERS:\n        action_required = False\n        reason = "Historical/outgoing communication is retained as context, not turned into new user work."\n    elif channel == "call":\n        action_required = event_type == "missed_call" and bool(normalized.get("action_required"))\n    elif _has_any(lower, _FRAUD_TERMS):\n        protected = True\n        action_required = True\n        interrupt = True\n        normalized["priority"] = "urgent"\n        reason = "Credible fraud/security wording requires immediate human judgment."\n    elif _has_any(lower, _OTP_TERMS) or (_CODE_RE.search(lower) and any(term in lower for term in ("code", "verific", "2fa", "login"))):\n        protected = True\n        action_required = False\n        reason = "Authentication code retained as protected evidence; only an active authentication objective may ask the user to approve."\n    elif _has_any(lower, _FINANCIAL_CONFIRMATION_TERMS) and not _has_any(lower, _REQUEST_TERMS):\n        protected = True\n        action_required = False\n        reason = "Financial confirmation retained as evidence; it does not imply a reply or manual task."\n    elif _has_any(lower, _ROUTINE_STATUS_TERMS) and not _has_any(lower, _REQUEST_TERMS):\n        action_required = False\n        reason = "Routine status information recorded without creating user work."\n    elif str(normalized.get("category") or "").casefold() in {"private/hidden notification", "notification", "notifications"}:\n        action_required = False\n        reason = "Routine/hidden notification metadata is not itself a task."\n\n    # If a safe executable reply already exists, the VA retains ownership.\n    if normalized.get("auto_reply_safe") and normalized.get("reply_text"):\n        action_required = False\n\n    if normalized.get("relationship_review_required"):\n        action_required = True\n    if action_required and str(normalized.get("priority") or "").casefold() == "urgent":\n        interrupt = True\n\n    normalized["protected"] = protected\n    normalized["action_required"] = action_required\n    normalized["interrupt"] = interrupt\n    normalized["routine_evidence"] = direction == "incoming" and not action_required\n    normalized["attention_reason"] = reason\n    if protected:\n        normalized["auto_reply_safe"] = False\n        normalized["reply_text"] = None\n    normalized["delete_from_device"] = bool(\n        direction == "incoming"\n        and not protected\n        and not action_required\n        and (\n            bool(normalized.get("spam"))\n            or str(normalized.get("category") or "").casefold() in {"spam", "promotion", "promotions", "newsletters & promotions"}\n        )\n        and _has_any(lower, _PROMO_TERMS)\n    )\n    return normalized\n\n\ndef is_marketing_subscription_false_positive(\n    *, sender: str, subject: str, body: str, subscription: dict[str, Any] | None\n) -> bool:\n    """Return True when mailing-list/footer language was mistaken for a paid subscription."""\n    if not subscription:\n        return False\n    text = f"{sender}\\n{subject}\\n{body[:12000]}".casefold()\n    if not _has_any(text, _PROMO_TERMS):\n        return False\n    if _has_any(text, _PAID_SUBSCRIPTION_TERMS) or _AMOUNT_RE.search(text):\n        return False\n    provider = str(subscription.get("provider_name") or subscription.get("provider") or "").casefold()\n    description = str(subscription.get("description") or "").casefold()\n    return any(term in text for term in ("unsubscribe", "uitschrijven", "afmelden", "newsletter", "nieuwsbrief")) or "newsletter" in provider + description\n')
          write('backend/app/services/briefing_policy.py', 'from __future__ import annotations\n\nfrom typing import Any\n\nfrom app.services.runtime_config import get_runtime_value\n\n\n_ALLOWED_NEEDS_YOU = {\n    "payment_authorization",\n    "payment_reconciliation",\n    "transfer_authorization",\n    "transfer_reconciliation",\n    "task_approval",\n    "provider_authorization",\n    "funding_required",\n    "urgent_communication",\n}\n\n\ndef filter_needs_you(items: list[dict[str, Any]]) -> list[dict[str, Any]]:\n    """Keep Needs You for actual human authority/auth/material requirements only."""\n    result: list[dict[str, Any]] = []\n    seen: set[tuple[str, str, str]] = set()\n    for raw in items:\n        item = dict(raw)\n        kind = str(item.get("type") or "")\n        if kind == "autopilot_exception":\n            if str(item.get("classification") or "") != "user_required":\n                continue\n        elif kind not in _ALLOWED_NEEDS_YOU:\n            continue\n        # AI availability/model/configuration is system-owned; deterministic fallback\n        # must keep mail moving rather than making the user operate the AI stack.\n        if kind == "provider_authorization" and str(item.get("id") or "") == "ai_primary":\n            continue\n        item.setdefault("interrupt", kind == "urgent_communication")\n        signature = (kind, str(item.get("id") or ""), str(item.get("title") or ""))\n        if signature in seen:\n            continue\n        seen.add(signature)\n        result.append(item)\n    return result\n\n\ndef human_briefing_summary(\n    stats: dict[str, Any],\n    payments: list[dict[str, Any]],\n    upcoming_bills: list[Any],\n    needs_you: list[dict[str, Any]],\n    *,\n    period: str = "daily",\n) -> str:\n    greeting = {\n        "morning": "Good morning.",\n        "afternoon": "Good afternoon.",\n        "evening": "Good evening.",\n    }.get(period, "Here is the latest.")\n    parts = [greeting]\n\n    if needs_you:\n        first = needs_you[0]\n        title = str(first.get("title") or "one item").strip()\n        detail = " ".join(str(first.get("detail") or "").split())\n        parts.append(f"Most things are under control, but there is one thing I need from you: {title}.")\n        if detail:\n            parts.append(detail[:360] + ("…" if len(detail) > 360 else ""))\n        if len(needs_you) > 1:\n            parts.append(f"There are {len(needs_you) - 1} other genuine user items behind it; I have kept everything else with the VA.")\n    else:\n        parts.append("Everything is under control and nothing needs your attention right now.")\n\n    if int(stats.get("emails_received") or 0) or int(stats.get("messages_received") or 0):\n        parts.append("I cleared the routine mail and messages that came in and kept the useful information with the relevant work.")\n    if int(stats.get("replies_sent") or 0) or int(stats.get("communication_replies_sent") or 0):\n        parts.append("I also handled the replies that were safe to send on your behalf.")\n    if int(stats.get("receipts_and_notices") or 0) or payments:\n        parts.append("Your financial notifications and records have been filed and reconciled where the provider evidence allowed it.")\n    if upcoming_bills:\n        parts.append("I am keeping an eye on the bills coming due and will only involve you if a real authorization or exception appears.")\n    if int(stats.get("calendar_changes") or 0):\n        parts.append("I updated your calendar where incoming information required it.")\n    if int(stats.get("provider_problems") or 0):\n        parts.append("A provider or internal service had an issue; I am keeping that system-owned and retrying or containing it rather than turning it into your task.")\n    return " ".join(parts)\n\n\nasync def briefing_period_schedule(db, local_now) -> list[dict[str, Any]]:\n    defaults = {\n        "morning": ("false", "8"),\n        "afternoon": ("false", "14"),\n        "evening": ("true", "19"),\n    }\n    periods: list[dict[str, Any]] = []\n    for name, (enabled_default, hour_default) in defaults.items():\n        enabled = (await get_runtime_value(db, f"briefing_{name}_enabled", enabled_default)).casefold() == "true"\n        try:\n            hour = max(0, min(int(await get_runtime_value(db, f"briefing_{name}_hour_local", hour_default)), 23))\n        except ValueError:\n            hour = int(hour_default)\n        periods.append({\n            "name": name,\n            "enabled": enabled,\n            "hour_local": hour,\n            "ready": enabled and local_now.hour >= hour,\n            "delivery_key": f"{local_now.date().isoformat()}:{name}",\n        })\n    return periods\n')
          write('backend/app/services/communication_backlog_repair.py', 'from __future__ import annotations\n\nimport json\nfrom types import SimpleNamespace\n\nfrom sqlalchemy import select\nfrom sqlalchemy.ext.asyncio import AsyncSession\n\nfrom app.models.entities import CommunicationEvent, EmailMessage, Task\nfrom app.services.audit import write_audit\nfrom app.services.communication_attention import normalize_communication_attention\n\n_OTP_TASK_TERMS = (\n    "one-time code", "one time code", "otp", "verification code", "verificatiecode",\n    "security code", "beveiligingscode", "2fa",\n)\n_PROVIDER_ERROR_TERMS = (\n    "groq", "gemini", "ai provider", "quota", "rate limit", "timeout", "google drive",\n    "drive archive", "provider error", "api error", "connection error", "404", "413",\n)\n_LOW_VALUE_CATEGORIES = ("newsletter", "promotion", "social", "notification", "low priority", "lage prioriteit")\n\n\ndef _saved_decision(email: EmailMessage | None) -> dict:\n    if email is None:\n        return {}\n    try:\n        value = json.loads(email.analysis_json or "{}")\n        return value if isinstance(value, dict) else {}\n    except json.JSONDecodeError:\n        return {}\n\n\ndef _email_has_real_structured_action(saved: dict) -> bool:\n    return any(saved.get(key) is not None for key in ("task", "reply", "calendar_event", "bill", "support_case", "order"))\n\n\nasync def repair_communication_backlog(db: AsyncSession) -> dict[str, int]:\n    """Cancel bad legacy projections while retaining the original evidence."""\n    cancelled_tasks = 0\n    repaired_events = 0\n    repaired_emails = 0\n    tasks = list((await db.execute(select(Task).where(Task.status.in_(["open", "waiting"])))).scalars())\n\n    # Remove exact duplicate projections first. Different source types for one email may\n    # still represent different real obligations, so dedupe only within source type/id.\n    seen_task_keys: set[tuple[str, str]] = set()\n    for task in sorted(tasks, key=lambda row: row.id, reverse=True):\n        source_type = str(task.source_type or "")\n        source_id = str(task.source_id or "")\n        if source_type == "manual" or not source_id:\n            continue\n        key = (source_type, source_id)\n        if key in seen_task_keys:\n            task.status = "cancelled"\n            task.requires_approval = False\n            cancelled_tasks += 1\n            continue\n        seen_task_keys.add(key)\n\n    for task in tasks:\n        if task.status not in {"open", "waiting"}:\n            continue\n        source_type = str(task.source_type or "").casefold()\n        text = f"{task.title}\\n{task.description}".casefold()\n        email = None\n        saved: dict = {}\n        if task.source_id and source_type.startswith("email"):\n            email = (await db.execute(select(EmailMessage).where(EmailMessage.provider_message_id == task.source_id).limit(1))).scalar_one_or_none()\n            saved = _saved_decision(email)\n\n        cancel = False\n        reason = ""\n        if source_type == "communication":\n            cancel, reason = True, "legacy device-message Task superseded by canonical CommunicationEvent ownership"\n        elif source_type in {"ai_review", "email_ai_review"}:\n            cancel, reason = True, "AI/provider availability is system-owned and is not a human task"\n        elif source_type == "email_archive" and any(term in text for term in _PROVIDER_ERROR_TERMS):\n            cancel, reason = True, "document/provider failure remains system-owned"\n        elif source_type != "manual" and any(term in text for term in _OTP_TASK_TERMS):\n            cancel, reason = True, "authentication-code message is evidence; the active authentication objective owns any real blocker"\n        elif source_type == "email_action" and email is not None:\n            category = str(saved.get("category") or email.category or "").casefold()\n            fallback_noise = any(term in text for term in _PROVIDER_ERROR_TERMS) or "deterministic fallback" in str(saved.get("reasoning_summary") or "").casefold()\n            low_value = any(term in category for term in _LOW_VALUE_CATEGORIES)\n            if (fallback_noise or low_value) and not _email_has_real_structured_action(saved):\n                cancel, reason = True, "informational/fallback email does not require user completion"\n                email.action_required = False\n                saved["action_required"] = False\n                email.analysis_json = json.dumps(saved, ensure_ascii=False, separators=(",", ":"))\n                repaired_emails += 1\n        elif source_type == "email_reply" and email is not None:\n            if email.status == "replied" or not saved.get("reply"):\n                cancel, reason = True, "saved email no longer has an unresolved reply decision"\n\n        if cancel:\n            task.status = "cancelled"\n            task.requires_approval = False\n            cancelled_tasks += 1\n            await write_audit(\n                db,\n                "communication_backlog_task_cancelled",\n                entity_type="task",\n                entity_id=str(task.id),\n                result="superseded",\n                details={"source_type": task.source_type, "reason": reason},\n            )\n\n    events = list((await db.execute(select(CommunicationEvent).where(CommunicationEvent.action_required.is_(True)))).scalars())\n    for event in events:\n        try:\n            decision = json.loads(event.decision_json or "{}")\n        except json.JSONDecodeError:\n            continue\n        payload = SimpleNamespace(body=event.body, provider=event.provider, direction=event.direction, channel=event.channel, event_type=event.event_type)\n        repaired = normalize_communication_attention(payload, decision)\n        if bool(repaired.get("action_required")) == bool(event.action_required) and bool(repaired.get("protected")) == bool(event.protected):\n            continue\n        event.action_required = bool(repaired.get("action_required"))\n        event.protected = bool(repaired.get("protected"))\n        event.decision_json = json.dumps(repaired, ensure_ascii=False, separators=(",", ":"))\n        repaired_events += 1\n\n    if cancelled_tasks or repaired_events or repaired_emails:\n        await write_audit(\n            db,\n            "communication_backlog_repaired",\n            entity_type="communications",\n            entity_id="canonical",\n            details={"cancelled_tasks": cancelled_tasks, "repaired_events": repaired_events, "repaired_emails": repaired_emails},\n        )\n        await db.commit()\n    return {"cancelled_tasks": cancelled_tasks, "repaired_events": repaired_events, "repaired_emails": repaired_emails}\n')
          write('android/lib/screens/message_conversations_page.dart', "import 'package:flutter/material.dart';\nimport 'package:provider/provider.dart';\n\nimport '../app_state.dart';\nimport '../theme/va_theme.dart';\n\nclass MessageConversationsPage extends StatefulWidget {\n  const MessageConversationsPage({super.key});\n\n  @override\n  State<MessageConversationsPage> createState() => _MessageConversationsPageState();\n}\n\nclass _MessageConversationsPageState extends State<MessageConversationsPage> {\n  final _search = TextEditingController();\n\n  @override\n  void dispose() {\n    _search.dispose();\n    super.dispose();\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    final state = context.watch<AppState>();\n    final conversations = _conversations(state);\n    final query = _search.text.trim().toLowerCase();\n    final filtered = query.isEmpty\n        ? conversations\n        : conversations.where((row) {\n            final haystack = '${row.name} ${row.address} ${row.preview}'.toLowerCase();\n            return haystack.contains(query);\n          }).toList();\n    return Scaffold(\n      appBar: AppBar(title: const Text('SMS/MMS conversations')),\n      body: RefreshIndicator(\n        onRefresh: () => context.read<AppState>().refreshCommunications(syncDeviceHistory: true),\n        child: ListView(\n          physics: const AlwaysScrollableScrollPhysics(),\n          padding: const EdgeInsets.fromLTRB(12, 10, 12, 28),\n          children: [\n            TextField(\n              controller: _search,\n              onChanged: (_) => setState(() {}),\n              decoration: const InputDecoration(\n                hintText: 'Search people or message text…',\n                prefixIcon: Icon(Icons.search_rounded),\n              ),\n            ),\n            const SizedBox(height: 10),\n            if (filtered.isEmpty)\n              const Card(\n                child: ListTile(\n                  leading: Icon(Icons.sms_outlined),\n                  title: Text('No SMS/MMS conversations synced yet'),\n                  subtitle: Text('Pull to refresh. SMS and MMS history are grouped by person or phone number.'),\n                ),\n              )\n            else\n              for (final conversation in filtered)\n                Card(\n                  child: ListTile(\n                    leading: CircleAvatar(child: Text(_initials(conversation.name))),\n                    title: Text(\n                      conversation.name,\n                      maxLines: 1,\n                      overflow: TextOverflow.ellipsis,\n                      style: const TextStyle(fontWeight: FontWeight.w800),\n                    ),\n                    subtitle: Text(\n                      conversation.preview,\n                      maxLines: 2,\n                      overflow: TextOverflow.ellipsis,\n                    ),\n                    trailing: Column(\n                      mainAxisAlignment: MainAxisAlignment.center,\n                      crossAxisAlignment: CrossAxisAlignment.end,\n                      children: [\n                        Text(_stamp(conversation.lastAt), style: const TextStyle(fontSize: 11, color: VaTheme.textMuted)),\n                        if (conversation.hasMms)\n                          const Padding(\n                            padding: EdgeInsets.only(top: 4),\n                            child: Text('MMS', style: TextStyle(fontSize: 10, color: VaTheme.secondary, fontWeight: FontWeight.w800)),\n                          ),\n                      ],\n                    ),\n                    onTap: () => Navigator.of(context).push(\n                      MaterialPageRoute<void>(\n                        builder: (_) => _ConversationPage(conversation: conversation),\n                      ),\n                    ),\n                  ),\n                ),\n          ],\n        ),\n      ),\n    );\n  }\n\n  List<_Conversation> _conversations(AppState state) {\n    final byPhone = <String, String>{};\n    for (final relationship in state.relationships) {\n      final phone = _digits('${relationship['primary_phone'] ?? ''}');\n      final name = '${relationship['display_name'] ?? ''}'.trim();\n      if (phone.isNotEmpty && name.isNotEmpty) byPhone[phone] = name;\n    }\n\n    final groups = <String, List<Map<String, dynamic>>>{};\n    for (final event in state.communications) {\n      final channel = '${event['channel'] ?? ''}'.toLowerCase();\n      final type = '${event['event_type'] ?? ''}'.toLowerCase();\n      if (channel != 'sms' || !{'message', 'mms'}.contains(type)) continue;\n      final incoming = '${event['direction'] ?? ''}' != 'outgoing';\n      final address = '${incoming ? event['sender'] : event['recipient'] ?? ''}'.trim();\n      final rawKey = '${event['thread_key'] ?? ''}'.trim();\n      final key = rawKey.isNotEmpty ? rawKey : _digits(address);\n      if (key.isEmpty) continue;\n      groups.putIfAbsent(key, () => <Map<String, dynamic>>[]).add(event);\n    }\n\n    final result = <_Conversation>[];\n    for (final entry in groups.entries) {\n      final messages = entry.value\n        ..sort((a, b) => _date(a).compareTo(_date(b)));\n      final latest = messages.last;\n      final incoming = '${latest['direction'] ?? ''}' != 'outgoing';\n      final address = '${incoming ? latest['sender'] : latest['recipient'] ?? ''}'.trim();\n      final normalized = _digits(address);\n      String? name = byPhone[normalized];\n      if (name == null && normalized.length >= 8) {\n        final suffix = normalized.substring(normalized.length - 8);\n        for (final candidate in byPhone.entries) {\n          if (candidate.key.endsWith(suffix)) {\n            name = candidate.value;\n            break;\n          }\n        }\n      }\n      final body = '${latest['body'] ?? ''}'.trim();\n      result.add(\n        _Conversation(\n          address: address,\n          name: name ?? (address.isEmpty ? 'Unknown sender' : address),\n          messages: messages,\n          preview: body.isEmpty ? 'MMS' : body,\n          lastAt: _date(latest),\n          hasMms: messages.any((row) => '${row['event_type'] ?? ''}'.toLowerCase() == 'mms'),\n        ),\n      );\n    }\n    result.sort((a, b) => b.lastAt.compareTo(a.lastAt));\n    return result;\n  }\n}\n\nclass _ConversationPage extends StatefulWidget {\n  const _ConversationPage({required this.conversation});\n  final _Conversation conversation;\n\n  @override\n  State<_ConversationPage> createState() => _ConversationPageState();\n}\n\nclass _ConversationPageState extends State<_ConversationPage> {\n  final _composer = TextEditingController();\n  bool _sending = false;\n\n  @override\n  void dispose() {\n    _composer.dispose();\n    super.dispose();\n  }\n\n  Future<void> _send() async {\n    final text = _composer.text.trim();\n    if (text.isEmpty || widget.conversation.address.isEmpty || _sending) return;\n    setState(() => _sending = true);\n    try {\n      await context.read<AppState>().sendSms(target: widget.conversation.address, text: text);\n      _composer.clear();\n      await context.read<AppState>().refreshCommunications(syncDeviceHistory: true);\n      if (mounted) Navigator.of(context).pop();\n    } catch (error) {\n      if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('$error')));\n    } finally {\n      if (mounted) setState(() => _sending = false);\n    }\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    final messages = widget.conversation.messages;\n    return Scaffold(\n      appBar: AppBar(\n        title: Column(\n          crossAxisAlignment: CrossAxisAlignment.start,\n          children: [\n            Text(widget.conversation.name, style: const TextStyle(fontSize: 17, fontWeight: FontWeight.w800)),\n            Text(widget.conversation.address, style: const TextStyle(fontSize: 11, color: VaTheme.textMuted)),\n          ],\n        ),\n      ),\n      body: Column(\n        children: [\n          Expanded(\n            child: ListView.builder(\n              padding: const EdgeInsets.fromLTRB(12, 14, 12, 14),\n              itemCount: messages.length,\n              itemBuilder: (context, index) {\n                final message = messages[index];\n                final outgoing = '${message['direction'] ?? ''}' == 'outgoing';\n                final body = '${message['body'] ?? ''}'.trim();\n                final isMms = '${message['event_type'] ?? ''}'.toLowerCase() == 'mms';\n                return Align(\n                  alignment: outgoing ? Alignment.centerRight : Alignment.centerLeft,\n                  child: Container(\n                    constraints: BoxConstraints(maxWidth: MediaQuery.sizeOf(context).width * .78),\n                    margin: const EdgeInsets.only(bottom: 8),\n                    padding: const EdgeInsets.fromLTRB(12, 9, 12, 8),\n                    decoration: BoxDecoration(\n                      color: outgoing ? VaTheme.primary.withValues(alpha: .26) : Colors.white.withValues(alpha: .07),\n                      borderRadius: BorderRadius.circular(16),\n                    ),\n                    child: Column(\n                      crossAxisAlignment: CrossAxisAlignment.start,\n                      children: [\n                        if (isMms)\n                          const Padding(\n                            padding: EdgeInsets.only(bottom: 4),\n                            child: Text('MMS', style: TextStyle(fontSize: 10, fontWeight: FontWeight.w900, color: VaTheme.secondary)),\n                          ),\n                        Text(body.isEmpty ? 'MMS message' : body, style: const TextStyle(height: 1.35)),\n                        const SizedBox(height: 4),\n                        Text(_stamp(_date(message)), style: const TextStyle(fontSize: 10, color: VaTheme.textMuted)),\n                      ],\n                    ),\n                  ),\n                );\n              },\n            ),\n          ),\n          SafeArea(\n            top: false,\n            child: Padding(\n              padding: const EdgeInsets.fromLTRB(10, 6, 10, 10),\n              child: Row(\n                children: [\n                  Expanded(\n                    child: TextField(\n                      controller: _composer,\n                      minLines: 1,\n                      maxLines: 5,\n                      decoration: const InputDecoration(hintText: 'SMS message…'),\n                    ),\n                  ),\n                  const SizedBox(width: 8),\n                  IconButton.filled(\n                    onPressed: _sending ? null : _send,\n                    icon: _sending\n                        ? const SizedBox.square(dimension: 18, child: CircularProgressIndicator(strokeWidth: 2))\n                        : const Icon(Icons.send_rounded),\n                  ),\n                ],\n              ),\n            ),\n          ),\n        ],\n      ),\n    );\n  }\n}\n\nclass _Conversation {\n  const _Conversation({\n    required this.address,\n    required this.name,\n    required this.messages,\n    required this.preview,\n    required this.lastAt,\n    required this.hasMms,\n  });\n  final String address;\n  final String name;\n  final List<Map<String, dynamic>> messages;\n  final String preview;\n  final DateTime lastAt;\n  final bool hasMms;\n}\n\nDateTime _date(Map<String, dynamic> row) =>\n    DateTime.tryParse('${row['occurred_at'] ?? row['created_at'] ?? ''}')?.toLocal() ?? DateTime.fromMillisecondsSinceEpoch(0);\n\nString _digits(String value) => value.replaceAll(RegExp(r'\\D'), '');\n\nString _initials(String value) {\n  final parts = value.trim().split(RegExp(r'\\s+')).where((part) => part.isNotEmpty).take(2).toList();\n  if (parts.isEmpty) return '?';\n  return parts.map((part) => part[0].toUpperCase()).join();\n}\n\nString _stamp(DateTime value) {\n  if (value.millisecondsSinceEpoch == 0) return '';\n  final now = DateTime.now();\n  if (value.year == now.year && value.month == now.month && value.day == now.day) {\n    return '${value.hour.toString().padLeft(2, '0')}:${value.minute.toString().padLeft(2, '0')}';\n  }\n  return '${value.day.toString().padLeft(2, '0')}/${value.month.toString().padLeft(2, '0')}';\n}\n")
          write('android/lib/services/background_service.dart', "import 'dart:convert';\n\nimport 'package:flutter_local_notifications/flutter_local_notifications.dart';\nimport 'package:flutter_secure_storage/flutter_secure_storage.dart';\nimport 'package:http/http.dart' as http;\nimport 'package:workmanager/workmanager.dart';\n\nconst vaBackgroundTask = 'full_time_va_priority_check';\nconst _dailyBriefingDayKey = 'last_va_daily_briefing_day'; // legacy migration key\nconst _briefingPeriodKey = 'last_va_briefing_period';\nconst _prioritySignatureKey = 'last_va_priority_signature';\n\nfinal FlutterLocalNotificationsPlugin notifications = FlutterLocalNotificationsPlugin();\n\nbool _isImmediateInterrupt(dynamic raw) {\n  if (raw is! Map) return false;\n  return raw['interrupt'] == true;\n}\n\nString _prioritySignature(List<dynamic> items) {\n  final normalized = items\n      .whereType<Map>()\n      .map((item) => [\n            '${item['type'] ?? ''}',\n            '${item['id'] ?? ''}',\n            '${item['title'] ?? ''}',\n            '${item['detail'] ?? ''}',\n          ].join('|'))\n      .toList()\n    ..sort();\n  return normalized.join('||');\n}\n\n@pragma('vm:entry-point')\nvoid callbackDispatcher() {\n  Workmanager().executeTask((taskName, inputData) async {\n    if (taskName != vaBackgroundTask) return true;\n    const storage = FlutterSecureStorage(aOptions: AndroidOptions());\n    final base = await storage.read(key: 'server_url');\n    final token = await storage.read(key: 'device_token');\n    if (base == null || token == null) return true;\n\n    try {\n      final response = await http.get(\n        Uri.parse('$base/api/autopilot/briefing'),\n        headers: {'Authorization': 'Bearer $token', 'Accept': 'application/json'},\n      ).timeout(const Duration(seconds: 30));\n      if (response.statusCode != 200) return true;\n      final data = jsonDecode(response.body) as Map<String, dynamic>;\n      final needsYou = data['needs_you'] as List? ?? const [];\n      final interrupts = needsYou.where(_isImmediateInterrupt).toList();\n\n      // The 15-minute check is intentionally silent for routine work. Only a backend\n      // item explicitly classified as an immediate interrupt is allowed to buzz.\n      final signature = _prioritySignature(interrupts);\n      final previousSignature = await storage.read(key: _prioritySignatureKey) ?? '';\n      if (interrupts.isEmpty) {\n        if (previousSignature.isNotEmpty) await storage.delete(key: _prioritySignatureKey);\n      } else if (signature.isNotEmpty && signature != previousSignature) {\n        final first = interrupts.first as Map;\n        await notifications.show(\n          id: 1001,\n          title: '${first['title'] ?? 'Full-Time VA needs you now'}',\n          body: '${first['detail'] ?? 'A genuine urgent decision is blocking active work.'}',\n          notificationDetails: const NotificationDetails(\n            android: AndroidNotificationDetails(\n              'va_priority',\n              'VA priority alerts',\n              channelDescription: 'Only genuine urgent human interruptions',\n              importance: Importance.high,\n              priority: Priority.high,\n            ),\n          ),\n        );\n        await storage.write(key: _prioritySignatureKey, value: signature);\n      }\n\n      final briefingDate = '${data['briefing_date'] ?? ''}';\n      final notification = data['notification'];\n      if (briefingDate.isNotEmpty && notification is Map) {\n        final enabled = notification['enabled'] == true;\n        final periods = (notification['periods'] as List? ?? const []).whereType<Map>().toList();\n        if (enabled && periods.isNotEmpty) {\n          final ready = periods.where((row) => row['enabled'] == true && row['ready'] == true).toList()\n            ..sort((a, b) => ((a['hour_local'] as num?)?.toInt() ?? 0)\n                .compareTo((b['hour_local'] as num?)?.toInt() ?? 0));\n          final lastKey = await storage.read(key: _briefingPeriodKey) ?? '';\n          final due = ready.where((row) => '${row['delivery_key'] ?? ''}' != lastKey).toList();\n          if (due.isNotEmpty) {\n            final period = due.last;\n            final name = '${period['name'] ?? 'daily'}';\n            final key = '${period['delivery_key'] ?? '$briefingDate:$name'}';\n            await notifications.show(\n              id: 1002,\n              title: '${name[0].toUpperCase()}${name.substring(1)} VA briefing',\n              body: '${notification['body'] ?? data['summary_text'] ?? 'Your VA briefing is ready.'}',\n              notificationDetails: const NotificationDetails(\n                android: AndroidNotificationDetails(\n                  'va_daily_briefing',\n                  'VA briefings',\n                  channelDescription: 'Scheduled human-style VA briefings',\n                  importance: Importance.defaultImportance,\n                  priority: Priority.defaultPriority,\n                ),\n              ),\n            );\n            await storage.write(key: _briefingPeriodKey, value: key);\n            // Keep the legacy key updated so downgrades do not duplicate the evening briefing.\n            await storage.write(key: _dailyBriefingDayKey, value: briefingDate);\n          }\n        } else {\n          // Compatibility with an older backend that exposes only one daily ready flag.\n          final ready = notification['ready'] == true;\n          final lastDay = await storage.read(key: _dailyBriefingDayKey) ?? '';\n          if (enabled && ready && lastDay != briefingDate) {\n            await notifications.show(\n              id: 1002,\n              title: '${notification['title'] ?? 'Your Full-Time VA daily briefing'}',\n              body: '${notification['body'] ?? data['summary_text'] ?? 'Your daily VA briefing is ready.'}',\n              notificationDetails: const NotificationDetails(\n                android: AndroidNotificationDetails(\n                  'va_daily_briefing',\n                  'VA briefings',\n                  channelDescription: 'Scheduled human-style VA briefings',\n                  importance: Importance.defaultImportance,\n                  priority: Priority.defaultPriority,\n                ),\n              ),\n            );\n            await storage.write(key: _dailyBriefingDayKey, value: briefingDate);\n          }\n        }\n      }\n    } catch (_) {\n      // Best-effort phone delivery. Backend ownership/state is unaffected.\n      return true;\n    }\n    return true;\n  });\n}\n\nFuture<void> initializeBackgroundService() async {\n  const android = AndroidInitializationSettings('@mipmap/ic_launcher');\n  await notifications.initialize(settings: const InitializationSettings(android: android));\n  final androidPlugin = notifications.resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>();\n  await androidPlugin?.requestNotificationsPermission();\n  await Workmanager().initialize(callbackDispatcher);\n  await Workmanager().registerPeriodicTask(\n    'full_time_va_priority_check_unique',\n    vaBackgroundTask,\n    frequency: const Duration(minutes: 15),\n    existingWorkPolicy: ExistingPeriodicWorkPolicy.update,\n    constraints: Constraints(networkType: NetworkType.connected),\n  );\n}\n")
