          write('backend/tests/test_v106_communications_autopilot.py', 'from types import SimpleNamespace\n\nfrom app.services.communication_attention import (\n    is_marketing_subscription_false_positive,\n    normalize_communication_attention,\n)\n\n\ndef payload(body: str, provider: str = "android_sms"):\n    return SimpleNamespace(body=body, provider=provider, direction="incoming", channel="sms", event_type="message")\n\n\ndef base(**overrides):\n    value = {\n        "category": "Conversation", "priority": "normal", "action_required": True,\n        "protected": False, "spam": False, "auto_reply_safe": False,\n        "reply_text": None, "reasoning_summary": "test",\n    }\n    value.update(overrides)\n    return value\n\n\ndef test_otp_is_protected_evidence_not_user_work():\n    result = normalize_communication_attention(payload("Your verification code is 123456"), base(protected=True))\n    assert result["protected"] is True\n    assert result["action_required"] is False\n    assert result["interrupt"] is False\n\n\ndef test_financial_confirmation_is_quiet_but_protected():\n    result = normalize_communication_attention(payload("EUR withdrawal initiated successfully"), base(protected=True))\n    assert result["protected"] is True\n    assert result["action_required"] is False\n    assert result["interrupt"] is False\n\n\ndef test_historical_sms_never_manufactures_new_user_work():\n    result = normalize_communication_attention(payload("Please call us", "android_sms_history"), base(action_required=True))\n    assert result["action_required"] is False\n\n\ndef test_fraud_alert_is_a_real_interrupt():\n    result = normalize_communication_attention(payload("Suspicious transaction: this payment was not authorized by you"), base(protected=True))\n    assert result["action_required"] is True\n    assert result["interrupt"] is True\n    assert result["priority"] == "urgent"\n\n\ndef test_unsubscribe_footer_is_not_paid_subscription():\n    assert is_marketing_subscription_false_positive(\n        sender="newsletter@example.com", subject="Weekly news",\n        body="Read this week\'s stories. Unsubscribe from this newsletter.",\n        subscription={"provider_name": "Example", "description": "Newsletter"},\n    ) is True\n\n\ndef test_real_billed_subscription_is_not_suppressed():\n    assert is_marketing_subscription_false_positive(\n        sender="service@example.com", subject="Your plan renews",\n        body="Your subscription renews monthly. Next charge €9.99. Unsubscribe from marketing mail here.",\n        subscription={"provider_name": "Example", "description": "Premium plan"},\n    ) is False\n')
          write('backend/tests/test_v106_communications_autopilot_contract.py', 'from pathlib import Path\n\nROOT = Path(__file__).parents[2]\n\n\ndef read(path: str) -> str:\n    return (ROOT / path).read_text(encoding="utf-8")\n\n\ndef test_attention_and_backlog_are_wired_into_live_paths():\n    service = read("backend/app/services/communications_service.py")\n    core = read("backend/app/services/autonomous_core.py")\n    planner = read("backend/app/services/autopilot_planner.py")\n    reconciler = read("backend/app/services/communication_backlog_repair.py")\n    assert "normalize_communication_attention" in service\n    assert "android_mms_history" in service\n    assert "repair_communication_backlog" in core\n    assert "repaired_emails" in reconciler\n    assert "blocked_capability" in planner\n    assert \'result="needs_user"\' not in planner.split("async def _escalate_unexecutable_due_tasks", 1)[1].split("async def proactive_plan", 1)[0]\n\n\ndef test_briefing_is_human_style_and_period_configurable():\n    briefing = read("backend/app/services/briefing_service.py")\n    policy = read("backend/app/services/briefing_policy.py")\n    config = read("backend/app/services/runtime_config.py")\n    background = read("android/lib/services/background_service.dart")\n    assert "human_briefing_summary" in briefing\n    assert "Good afternoon." in policy\n    assert "Autopilot handled {stats[\'va_actions\']}" not in briefing\n    for name in ("morning", "afternoon", "evening"):\n        assert f"briefing_{name}_enabled" in config\n        assert f"briefing_{name}_hour_local" in config\n    assert "last_va_briefing_period" in background\n    assert "_isImmediateInterrupt" in background\n    assert \'"urgent_communication"\' in policy\n\n\ndef test_android_sms_mms_conversation_and_quiet_interrupt_contract():\n    activity = read("android/android/app/src/main/kotlin/com/fulltimeva/full_time_va/MainActivity.kt")\n    receiver = read("android/android/app/src/main/kotlin/com/fulltimeva/full_time_va/SmsReceiver.kt")\n    comms = read("android/lib/screens/communications_page.dart")\n    conversations = read("android/lib/screens/message_conversations_page.dart")\n    state = read("android/lib/app_state.dart")\n    assert "collectMms" in activity\n    assert \'provider", "android_mms_history"\' in activity\n    assert \'optBoolean("interrupt", false)\' in receiver\n    assert \'optBoolean("delete_from_device", false)\' in receiver\n    assert "MessageConversationsPage" in comms\n    assert "SMS/MMS conversations" in conversations\n    assert "/api/communications/events?limit=1000" in state\n    assert "version: 1.0.5+48" in read("android/pubspec.yaml")\n\n\ndef test_low_value_mail_and_provider_errors_stay_off_user_queue():\n    processor = read("backend/app/services/email_processor.py")\n    policy = read("backend/app/services/ai_policy.py")\n    assert \'"CATEGORY_PROMOTIONS" in label_ids\' in policy\n    assert "safe_low_value_list" in policy\n    assert \'result="blocked_system"\' in processor\n    assert "if False and existing_archive_task is None" in processor\n    assert "Handled with deterministic fallback while the AI provider was unavailable." in policy\n\n\ndef test_manual_complete_is_exception_only():\n    tasks = read("android/lib/screens/tasks_page.dart")\n    assert "manualCompletionAllowed" in tasks\n    assert "I did this" in tasks\n    assert "label: const Text(\'Complete\')" not in tasks\n')
          write('docs/COMMUNICATIONS_AUTOPILOT_V2.md', '# Communications Autopilot and Human Briefing\n\nVAAPP treats communication handling as VA-owned work by default. Protected/sensitive evidence is separate from actionability: OTPs, routine financial confirmations, tickets, delivery updates and informational notices do not become Needs You work merely because they mention money, security or verification.\n\nHigh-confidence mailing-list/promotional Gmail messages can go straight to Trash even when unread. Mailing-list unsubscribe language is not evidence of a paid subscription. Provider/AI defects stay system-owned and their raw error text is kept in diagnostics rather than assigned to the user.\n\nImmediate Android alerts require an explicit `interrupt` decision, currently reserved for genuinely urgent communication such as credible fraud/security wording. Routine execution is reported in scheduled, narrative VA briefings. Morning, afternoon and evening periods are independently configurable; defaults remain morning off, afternoon off and evening on.\n\nAndroid SMS history includes MMS text backfill and a person/thread-based conversation view. The app requests up to 1,000 communication events for that view. Newly received high-confidence promotional SMS can be removed from the Android SMS store only when VAAPP is the default SMS handler and the backend explicitly returns `delete_from_device=true`.\n\nLegacy communication tasks, stale OTP work, duplicate task projections and provider-error tasks are repaired without deleting source evidence. Manual completion is restricted to genuinely manual/physical tasks; provider work remains complete only after independent verification.\n')
          required = ['backend/app/services/communication_attention.py', 'backend/app/services/briefing_policy.py', 'backend/app/services/communication_backlog_repair.py', 'android/lib/screens/message_conversations_page.dart', 'backend/tests/test_v106_communications_autopilot.py', 'backend/tests/test_v106_communications_autopilot_contract.py']
          for name in required:
              if not path(name).is_file() or path(name).stat().st_size == 0:
                  raise SystemExit(f'Missing generated source: {name}')
          PY
          python3 -m compileall -q backend/app backend/tests
          grep -q 'version: 1.0.5+48' android/pubspec.yaml
          grep -q 'MessageConversationsPage' android/lib/screens/communications_page.dart
          grep -q 'optBoolean("interrupt", false)' android/android/app/src/main/kotlin/com/fulltimeva/full_time_va/SmsReceiver.kt

      - name: Run complete backend gate
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/va-venv"
          source "$RUNNER_TEMP/va-venv/bin/activate"
          python -m pip install --upgrade pip
          pip install -e './backend[dev]'
          python -m compileall -q backend/app backend/tests
          ruff check backend/app backend/tests --select E9,F63,F7,F82
          PUBLIC_BASE_URL=https://example.invalid \
          PAIRING_SECRET=github-actions-pairing-secret-00000000 \
          TOKEN_ENCRYPTION_KEY=MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE= \
          pytest -q backend/tests

      - name: Install Flutter directly
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          for attempt in 1 2 3 4 5; do
            if git clone --filter=blob:none --depth=1 --branch "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_DIR"; then
              break
            fi
            rm -rf "$FLUTTER_DIR"
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" config --no-analytics
          "$FLUTTER_DIR/bin/flutter" precache --android

      - name: Prepare release signing
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing signing secret $name" >&2; exit 1; }
          done
          KEYSTORE_PATH="$RUNNER_TEMP/full-time-va-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Analyze, test and compile signed APK
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          cd android
          flutter create --platforms=android --org com.fulltimeva --project-name full_time_va .
          cp tooling/app-build.gradle.kts android/app/build.gradle.kts
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp "tooling/app_icon/ic_launcher_${density}.png" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "tooling/app_icon/ic_launcher_${density}.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          for attempt in 1 2 3 4 5; do
            if (cd android && ./gradlew --version); then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            rm -rf "$HOME/.gradle/wrapper/dists"
            sleep $((attempt * 10))
          done
          for attempt in 1 2 3; do
            if flutter build apk --release; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.5-build48.apk"
          sha256sum "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.5-build48.apk" \
            > "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.5-build48.apk.sha256"

      - name: Commit only validated source and self-remove installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f android/android/local.properties
          rm -f android/android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          git rm "$INSTALLER_PATH"
          git rm -f .github/workflows/apply-communications-autopilot-v1.yml
          git add \
            backend/app/services/communication_attention.py \
            backend/app/services/briefing_policy.py \
            backend/app/services/communication_backlog_repair.py \
            backend/app/services/communications_service.py \
            backend/app/services/email_processor.py \
            backend/app/services/ai_policy.py \
            backend/app/services/briefing_service.py \
            backend/app/services/runtime_config.py \
            backend/app/services/autonomous_core.py \
            backend/app/services/autopilot_planner.py \
            backend/tests \
            android/android/app/src/main/kotlin/com/fulltimeva/full_time_va/MainActivity.kt \
            android/android/app/src/main/kotlin/com/fulltimeva/full_time_va/SmsReceiver.kt \
            android/lib/app_state.dart \
            android/lib/screens/communications_page.dart \
            android/lib/screens/message_conversations_page.dart \
            android/lib/screens/tasks_page.dart \
            android/lib/services/background_service.dart \
            android/lib/widgets/daily_briefing_card.dart \
            android/pubspec.yaml \
            docs/COMMUNICATIONS_AUTOPILOT_V2.md

          python3 - <<'PY'
          import subprocess
          allowed_exact = {
              ".github/workflows/apply-communications-autopilot-v2.yml",
              ".github/workflows/apply-communications-autopilot-v1.yml",
              "backend/app/services/communication_attention.py",
              "backend/app/services/briefing_policy.py",
              "backend/app/services/communication_backlog_repair.py",
              "backend/app/services/communications_service.py",
              "backend/app/services/email_processor.py",
              "backend/app/services/ai_policy.py",
              "backend/app/services/briefing_service.py",
              "backend/app/services/runtime_config.py",
              "backend/app/services/autonomous_core.py",
              "backend/app/services/autopilot_planner.py",
              "android/android/app/src/main/kotlin/com/fulltimeva/full_time_va/MainActivity.kt",
              "android/android/app/src/main/kotlin/com/fulltimeva/full_time_va/SmsReceiver.kt",
              "android/lib/app_state.dart",
              "android/lib/screens/communications_page.dart",
              "android/lib/screens/message_conversations_page.dart",
              "android/lib/screens/tasks_page.dart",
              "android/lib/services/background_service.dart",
              "android/lib/widgets/daily_briefing_card.dart",
              "android/pubspec.yaml",
              "docs/COMMUNICATIONS_AUTOPILOT_V2.md",
          }
          staged = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          bad = [p for p in staged if p not in allowed_exact and not p.startswith("backend/tests/")]
          if bad:
              raise SystemExit(f"Refusing unexpected staged paths: {bad}")
          PY

          git config user.name "VAAPP Communications Autopilot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: add communications autopilot and human briefings"
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:main"
          echo "NEW_SHA=$NEW_SHA" >> "$GITHUB_ENV"

      - name: Publish validated APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="va-android-v1.0.5-build48-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.5-build48.apk" \
            "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.5-build48.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$NEW_SHA" \
            --title "Full-Time VA Android v1.0.5+48 · Communications Autopilot" \
            --notes "Validated backend + Flutter release implementing quiet communications autonomy, immediate-only urgent alerts, natural VA briefings, backlog repair, direct low-value mail cleanup and SMS/MMS conversations." \
            --prerelease
          {
            echo '## Communications Autopilot v2 installed'
            echo
            echo "Commit: $NEW_SHA"
            echo "APK release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
