name: Fix People Directory Route

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_BASELINE: 41f78a2481a5a5cf2d566860ced8519cec0b3490
      INSTALLER_PATH: .github/workflows/fix-people-directory-route.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git fetch --no-tags --depth=10 origin main
          git checkout -B main FETCH_HEAD

      - name: Verify clean baseline
        shell: bash
        run: |
          set -euo pipefail
          if ! git cat-file -e "${EXPECTED_BASELINE}^{commit}" 2>/dev/null; then
            echo "Verified baseline is not in checkout history." >&2
            exit 1
          fi
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASELINE" HEAD)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "$INSTALLER_PATH" ]; then
            echo "Refusing to apply: unexpected repository changes since baseline:" >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi
          echo "INSTALLER_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply route fix and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          routes = Path("backend/app/api/routes.py")
          text = routes.read_text(encoding="utf-8")
          old = '@router.get("/api/relationships/{relationship_id}")'
          new = '@router.get("/api/relationships/{relationship_id:int}")'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one legacy relationship detail route; found {count}")
          routes.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("backend/tests/test_people_directory_contract.py")
          test_text = test_path.read_text(encoding="utf-8")
          marker = "def test_people_directory_static_route_is_not_shadowed_by_relationship_id():"
          if marker not in test_text:
              test_text += (
                  "\n\ndef test_people_directory_static_route_is_not_shadowed_by_relationship_id():\n"
                  "    legacy_routes = _read(\"backend/app/api/routes.py\")\n"
                  "    people_routes = _read(\"backend/app/api/v105_routes.py\")\n"
                  "    assert '@router.get(\"/api/relationships/{relationship_id:int}\")' in legacy_routes\n"
                  "    assert '@router.get(\"/api/relationships/directory\")' in people_routes\n"
              )
              test_path.write_text(test_text, encoding="utf-8")
          PY

          rm -f "$INSTALLER_PATH"
          git diff --check

      - name: Run backend validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m compileall -q backend/app backend/tests
          pytest -q backend/tests/test_people_directory_contract.py
          pytest -q backend/tests

      - name: Recheck main before push
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_head" != "$INSTALLER_HEAD" ]; then
            echo "main changed while tests were running; refusing to overwrite it." >&2
            echo "Expected: $INSTALLER_HEAD" >&2
            echo "Found:    $remote_head" >&2
            exit 1
          fi

      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VAAPP People Route Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          mapfile -t changed < <(git diff --cached --name-only)
          printf 'Committing:\n'
          printf '  %s\n' "${changed[@]}"
          if [ "${#changed[@]}" -ne 3 ]; then
            echo "Expected route file, regression test, and installer deletion only." >&2
            exit 1
          fi
          git commit -m "fix: reserve People directory route"
          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git push origin HEAD:main

      - name: Result
        run: echo "People directory route collision fixed and backend tests passed."
