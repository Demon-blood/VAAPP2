name: Release Briefing Notification Fix APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v122-briefing-notification-fix.yml'

permissions:
  contents: write

concurrency:
  group: release-v122-briefing-notification-fix
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      FLUTTER_VERSION: '3.38.7'
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"

          for attempt in 1 2 3 4 5; do
            if GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
              git fetch --no-tags --depth=1 origin "$GITHUB_SHA"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Repository fetch failed after five attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

          git checkout --detach FETCH_HEAD
          rm -f "$RUNNER_TEMP/git-askpass.sh"

      - name: Verify briefing notification fix is present
        run: |
          set -euo pipefail

          SOURCE='android/lib/services/background_service.dart'
          TEST='backend/tests/test_v122_briefing_notification_contract.py'

          test -f "$SOURCE"
          test -f "$TEST"

          grep -q 'BigTextStyleInformation' "$SOURCE"
          grep -q 'styleInformation: BigTextStyleInformation' "$SOURCE"
          grep -q '_briefingCollapsedBody' "$SOURCE"
          grep -q '_briefingExpandedBody' "$SOURCE"

          test "$(grep -c 'body: _briefingCollapsedBody(briefingBody)' "$SOURCE")" = "2"
          test "$(grep -c '_briefingNotificationDetails(briefingTitle, briefingBody)' "$SOURCE")" = "2"

      - name: Run briefing notification regression contract
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/briefing-test-venv"
          source "$RUNNER_TEMP/briefing-test-venv/bin/activate"
          python -m pip install --upgrade pip
          pip install pytest
          pytest -q backend/tests/test_v122_briefing_notification_contract.py

      - name: Install Flutter
        run: |
          set -euo pipefail

          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          for attempt in 1 2 3 4 5; do
            if git clone --filter=blob:none --depth=1 --branch "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_DIR"; then
              break
            fi
            rm -rf "$FLUTTER_DIR"
            if [ "$attempt" -eq 5 ]; then
              echo "Flutter SDK download failed after five attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" config --no-analytics
          "$FLUTTER_DIR/bin/flutter" --version
          "$FLUTTER_DIR/bin/flutter" precache --android

      - name: Prepare Android release signing
        run: |
          set -euo pipefail

          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/full-time-va-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Analyze test and build signed APK
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          cd android

          flutter create \
            --platforms=android \
            --org com.fulltimeva \
            --project-name full_time_va \
            .

          cp tooling/app-build.gradle.kts android/app/build.gradle.kts

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp "tooling/app_icon/ic_launcher_${density}.png" \
              "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "tooling/app_icon/ic_launcher_${density}.png" \
              "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done

          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

          for attempt in 1 2 3 4 5; do
            if (cd android && ./gradlew --version); then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Gradle wrapper download failed after five attempts." >&2
              exit 1
            fi
            rm -rf "$HOME/.gradle/wrapper/dists"
            sleep $((attempt * 10))
          done

          for attempt in 1 2 3; do
            if flutter build apk --release; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android release build failed after three attempts." >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

          APK='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"

          APP_VERSION="$(awk '/^version:[[:space:]]*/ {sub(/^version:[[:space:]]*/, ""); print; exit}' pubspec.yaml)"
          test -n "$APP_VERSION"
          SEMVER="${APP_VERSION%%+*}"

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "SEMVER=$SEMVER" >> "$GITHUB_ENV"

          OUTPUT="$RUNNER_TEMP/Full-Time-VA-Android-v${SEMVER}-briefing-notification-fix.apk"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" > "${OUTPUT}.sha256"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_TAG="va-android-briefing-fix-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          APK="$RUNNER_TEMP/Full-Time-VA-Android-v${SEMVER}-briefing-notification-fix.apk"

          test -s "$APK"
          test -s "${APK}.sha256"

          gh release create "$RELEASE_TAG" \
            "$APK" \
            "${APK}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Full-Time VA Android v${SEMVER} · Briefing Notification Fix" \
            --notes "Signed Android APK containing the briefing notification presentation fix. Long VA briefings use Android BigTextStyleInformation with a concise collapsed preview and the complete briefing when expanded. Both scheduled briefing delivery and the legacy fallback notification path are covered. Regression tests, Flutter analysis, Flutter tests and the signed release build passed before publication." \
            --prerelease

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,name,assets

          {
            echo '## Briefing notification fix released'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Version: \`${APP_VERSION}\`"
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- APK: \`Full-Time-VA-Android-v${SEMVER}-briefing-notification-fix.apk\`"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
