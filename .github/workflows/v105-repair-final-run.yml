name: v1.0.5 FINAL Repair Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v105-repair-final-run.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Verify unrepaired v1.0.5 partial state
        run: |
          set -euo pipefail
          grep -F 'APP_VERSION = "1.0.4"' backend/app/core/version.py
          grep -F 'version: 1.0.4+46' android/pubspec.yaml
          test -f repair_v105_after_partial_upload.py
          test -f backend/app/api/v105_routes.py
          test -f backend/app/services/specific_authorization.py
          test -f android/lib/screens/relationship_preferences_page.dart
          git diff --quiet
          git diff --cached --quiet

      - name: Apply repair without modifying the repair script first
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path("repair_v105_after_partial_upload.py").resolve()
          source = p.read_text(encoding="utf-8")
          old = 'REPAIR_BASE_COMMIT = "3bf8794c21ac30f61e1ccf84e452fc65785187a4"'
          new = f'REPAIR_BASE_COMMIT = "{os.environ["GITHUB_SHA"]}"'
          if source.count(old) != 1:
              raise SystemExit("repair base marker missing or duplicated")
          source = source.replace(old, new, 1)
          ns = {"__name__": "__main__", "__file__": str(p), "__package__": None}
          exec(compile(source, str(p), "exec"), ns, ns)
          PY

      - name: Run backend gate
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/v105"
          source "$RUNNER_TEMP/v105/bin/activate"
          python -m pip install --upgrade pip
          pip install -e './backend[dev]'
          python -m compileall -q backend/app backend/tests
          ruff check backend/app backend/tests --select E9,F63,F7,F82
          PUBLIC_BASE_URL=https://example.invalid \
          PAIRING_SECRET=github-actions-pairing-secret-00000000 \
          TOKEN_ENCRYPTION_KEY=MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE= \
          pytest -q backend/tests

      - name: Commit repaired source to main
        run: |
          set -euo pipefail
          rm -f \
            repair_v105_after_partial_upload.py \
            V105_REPAIR_README.md \
            apply_v105_human_boundary.py \
            V105_DELTA_README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && {
            echo "Repair produced no changes." >&2
            exit 1
          }
          git commit -m "v1.0.5 — complete Human Boundary & Relationship-Aware Communications"
          echo "REPAIRED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Start normal Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/android-release.yml/dispatches" \
            -f ref=main
          echo "Repaired commit ${REPAIRED_SHA} pushed; Build Android APK dispatched."
