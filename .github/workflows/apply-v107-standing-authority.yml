name: Apply v1.0.7 Standing Authority

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v107-standing-authority.yml'

permissions:
  contents: write

concurrency:
  group: apply-v107-standing-authority
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLUTTER_VERSION: '3.38.7'
      INSTALLER_PATH: '.github/workflows/apply-v107-standing-authority.yml'
      SOURCE_BASE: '257271e8130857c1cf6cc30f2b689b932a59482d'
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out installer commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git fetch --no-tags --depth=1 origin "$SOURCE_BASE"
          git checkout --detach "$GITHUB_SHA"
          rm -f "$RUNNER_TEMP/git-askpass.sh"

      - name: Fail closed on v1.0.6 source drift
        run: |
          set -euo pipefail
          test -f "$INSTALLER_PATH" || {
            echo "Refusing to patch: $INSTALLER_PATH is not present in the triggering commit" >&2
            exit 1
          }
          mapfile -t changed < <(git diff --name-only "$SOURCE_BASE" HEAD)
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/apply-v106-executive-commitment-graph.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v2.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v3.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v4.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v5.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v6.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v7.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v8.yml|\
              .github/workflows/apply-v107-standing-authority.yml) ;;
              *)
                echo "Refusing to patch: application source drift since $SOURCE_BASE: $path" >&2
                exit 1
                ;;
            esac
          done
          test "$(git show "$SOURCE_BASE":backend/app/core/version.py | tr -d '\r')" = $'APP_VERSION = "1.0.6"\nREQUIRED_ANDROID_VERSION = "1.0.6"'
          test "$(git show "$SOURCE_BASE":android/pubspec.yaml | grep '^version:')" = 'version: 1.0.6+49'
          test "$(cat backend/app/core/version.py | tr -d '\r')" = $'APP_VERSION = "1.0.6"\nREQUIRED_ANDROID_VERSION = "1.0.6"'
          test "$(grep '^version:' android/pubspec.yaml)" = 'version: 1.0.6+49'
          grep -q 'class VACommitmentEdge' backend/app/models/entities.py
          grep -q 'executive_commitment_overview' backend/app/services/commitment_graph.py

      - name: Apply guarded v1.0.7 source patch
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/standing_authority.py
          printf '%s' '' | base64 --decode > /tmp/v107_routes.py
          printf '%s' '' | base64 --decode > /tmp/test_v107_standing_authority.py
          printf '%s' '' | base64 --decode > /tmp/test_v107_standing_authority_contract.py
          printf '%s' '' | base64 --decode > /tmp/V1.0.7_STANDING_AUTHORITY_AND_RISK_BOUNDED_DELEGATION.md
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/apply-v107.py"
          echo 'b81657dc5fde4a06a7cea0382d4dc54be5c48a6b334b8e3726ce6014cbaaba4e  /tmp/standing_authority.py' | sha256sum -c -
          echo '7e0b9f6ec275342b7e024ff7c57304634ce99b9e2fbaeeea825b4c66b68c12e9  /tmp/v107_routes.py' | sha256sum -c -
          echo 'e0fbca9f4153c973093633ac1f6e1fa076ee9c188da184af4d18683444a3cb7a  /tmp/test_v107_standing_authority.py' | sha256sum -c -
          echo 'f1ef6f5116c95847c151449ce14cebee4ba43dfd73033b904a1d93c51305c8cf  /tmp/test_v107_standing_authority_contract.py' | sha256sum -c -
          echo '6b8a267c1efda9fa5b91cb22a77ef438f0d8395cf360ffd5dbe4506e734fc1cd  /tmp/V1.0.7_STANDING_AUTHORITY_AND_RISK_BOUNDED_DELEGATION.md' | sha256sum -c -
          printf '%s  %s\n' '3ab2a8080b39afe57d6282251cbf8eecdc31172a96d39ca0b6f93e817a1bfe7c' "$RUNNER_TEMP/apply-v107.py" | sha256sum -c -
          python3 -m py_compile \
            "$RUNNER_TEMP/apply-v107.py" \
            /tmp/standing_authority.py \
            /tmp/v107_routes.py \
            /tmp/test_v107_standing_authority.py \
            /tmp/test_v107_standing_authority_contract.py
          python3 "$RUNNER_TEMP/apply-v107.py"
          git diff --check
          grep -q 'APP_VERSION = "1.0.7"' backend/app/core/version.py
          grep -q 'version: 1.0.7+50' android/pubspec.yaml
          grep -q '_DOMAIN = "standing_authority"' backend/app/services/standing_authority.py
          grep -q 'apply_standing_authority_objectives' backend/app/services/autonomous_core.py
          grep -q 'evaluate_standing_authority' backend/app/services/va_policy.py
          grep -q 'v107_router' backend/app/main.py
          grep -q 'Standing authority' android/lib/screens/va_operations_page.dart
          grep -q 'Hard human boundaries always stay with you' android/lib/screens/va_operations_page.dart
          grep -q 'Bounded portal transactions' android/lib/screens/va_operations_page.dart
          grep -q 'vaAuthorities' android/lib/app_state.dart
          grep -q 'updateVaAuthority' android/lib/app_state.dart
          # The patch itself must never touch workflow files. The installer file is
          # already committed in HEAD, so any working-tree workflow diff is a defect.
          git diff --quiet HEAD -- .github/workflows || {
            echo 'Refusing to continue: v1.0.7 patch changed a GitHub workflow file.' >&2
            git diff --name-only HEAD -- .github/workflows >&2
            exit 1
          }

      - name: Backend correctness gate
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/va-venv"
          source "$RUNNER_TEMP/va-venv/bin/activate"
          python -m pip install --upgrade pip
          pip install -e './backend[dev]'
          python -m compileall -q backend/app backend/tests
          ruff check backend/app backend/tests --select E9,F63,F7,F82
          PUBLIC_BASE_URL=https://example.invalid \
          PAIRING_SECRET=github-actions-pairing-secret-00000000 \
          TOKEN_ENCRYPTION_KEY=MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE= \
          pytest -q backend/tests

      - name: Commit validated source locally
        run: |
          set -euo pipefail
          git config user.name 'VAAPP Standing Authority'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing to push: validated source commit unexpectedly changes a workflow file.' >&2
            git diff --cached --name-only -- .github/workflows/ >&2
            exit 1
          fi
          git commit -m 'feat: add standing authority and bounded delegation'
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Flutter
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          for attempt in 1 2 3 4 5; do
            if git clone --filter=blob:none --depth=1 --branch "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_DIR"; then
              break
            fi
            rm -rf "$FLUTTER_DIR"
            if [ "$attempt" -eq 5 ]; then
              echo 'Flutter SDK download failed after five attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" config --no-analytics
          "$FLUTTER_DIR/bin/flutter" precache --android

      - name: Prepare Android release signing
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/full-time-va-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Analyze, test and build Android v1.0.7
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          cd android
          flutter create --platforms=android --org com.fulltimeva --project-name full_time_va .
          cp tooling/app-build.gradle.kts android/app/build.gradle.kts
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp "tooling/app_icon/ic_launcher_${density}.png" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "tooling/app_icon/ic_launcher_${density}.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          for attempt in 1 2 3 4 5; do
            if (cd android && ./gradlew --version); then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            rm -rf "$HOME/.gradle/wrapper/dists"
            sleep $((attempt * 10))
          done
          for attempt in 1 2 3; do
            if flutter build apk --release; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.7.apk"
          sha256sum "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.7.apk" \
            | tee "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.7.apk.sha256"

      - name: Push validated release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/git-askpass-push.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass-push.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass-push.sh" GIT_TERMINAL_PROMPT=0 \
            git push origin HEAD:main
          rm -f "$RUNNER_TEMP/git-askpass-push.sh"

      - name: Publish Android v1.0.7 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="va-android-107-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.7.apk" \
            "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.7.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "Full-Time VA Android v1.0.7 · Standing Authority" \
            --notes "Validated v1.0.7 release for commit $RELEASE_COMMIT. Adds explicit, revocable standing authority for routine communications and bounded portal transactions; hard authentication, identity, contract/consent, security, critical-risk and physical boundaries remain human-only, and completion remains evidence-gated." \
            --prerelease
          {
            echo '## v1.0.7 ready'
            echo
            echo "Commit: $RELEASE_COMMIT"
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
