name: Apply v1.0.6 Executive Commitment Graph v8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v106-executive-commitment-graph-v8.yml'

permissions:
  contents: write

concurrency:
  group: apply-v106-executive-commitment-graph-v8
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLUTTER_VERSION: '3.38.7'
      INSTALLER_PATH: '.github/workflows/apply-v106-executive-commitment-graph-v8.yml'
      SOURCE_BASE: '0a336afaff022c060a495a4620aef16052b2bf02'
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out installer commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git fetch --no-tags --depth=1 origin "$SOURCE_BASE"
          git checkout --detach "$GITHUB_SHA"
          rm -f "$RUNNER_TEMP/git-askpass.sh"

      - name: Fail closed on application source drift
        run: |
          set -euo pipefail
          test -f "$INSTALLER_PATH" || {
            echo "Refusing to patch: $INSTALLER_PATH is not present in the triggering commit" >&2
            exit 1
          }
          mapfile -t changed < <(git diff --name-only "$SOURCE_BASE" HEAD)
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/apply-v106-executive-commitment-graph.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v2.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v3.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v4.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v5.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v6.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v7.yml|\
              .github/workflows/apply-v106-executive-commitment-graph-v8.yml) ;;
              *)
                echo "Refusing to patch: application source drift since $SOURCE_BASE: $path" >&2
                exit 1
                ;;
            esac
          done
          test "$(git show "$SOURCE_BASE":backend/app/core/version.py | tr -d '\r')" = $'APP_VERSION = "1.0.5"\nREQUIRED_ANDROID_VERSION = "1.0.5"'
          test "$(git show "$SOURCE_BASE":android/pubspec.yaml | grep '^version:')" = 'version: 1.0.5+48'
          test "$(cat backend/app/core/version.py | tr -d '\r')" = $'APP_VERSION = "1.0.5"\nREQUIRED_ANDROID_VERSION = "1.0.5"'
          test "$(grep '^version:' android/pubspec.yaml)" = 'version: 1.0.5+48'

      - name: Apply guarded v1.0.6 source patch
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/commitment_graph.py
          printf '%s' '' | base64 --decode > /tmp/test_v106_executive_commitment_graph.py
          printf '%s' '' | base64 --decode > /tmp/test_v106_executive_commitment_contract.py
          printf '%s' '' | base64 --decode > /tmp/V1.0.6_AUTONOMOUS_EXECUTIVE_COMMITMENT_GRAPH.md
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/apply-v106.py"
          echo "66d2d1ea7962331c3beffe28fa1e2a706f022fbdffd5bc5f023f14ca5c4c53b2  $RUNNER_TEMP/apply-v106.py" | sha256sum -c -
          echo '5be73412f3f13768b4782a1d73cbea43dc7f096ec091f19da8638c7b6d95f573  /tmp/commitment_graph.py' | sha256sum -c -
          echo 'ca0cf368276455769fb9945877df1b9b72efe3534e0150569e9c79246a453694  /tmp/test_v106_executive_commitment_graph.py' | sha256sum -c -
          echo '83ec0b0478907bb27bc426aa83364e5b338dfaa9cd734b194a7699b0a80cad55  /tmp/test_v106_executive_commitment_contract.py' | sha256sum -c -
          echo 'c1cbb28f8268a78c9cbb0f4033e446eeadf37d8f5fb9d3eb94f696f7f8ce5e50  /tmp/V1.0.6_AUTONOMOUS_EXECUTIVE_COMMITMENT_GRAPH.md' | sha256sum -c -
          python3 -m py_compile "$RUNNER_TEMP/apply-v106.py" /tmp/commitment_graph.py \
            /tmp/test_v106_executive_commitment_graph.py /tmp/test_v106_executive_commitment_contract.py
          python3 "$RUNNER_TEMP/apply-v106.py"
          git diff --check
          grep -q 'APP_VERSION = "1.0.6"' backend/app/core/version.py
          grep -q 'version: 1.0.6+49' android/pubspec.yaml
          grep -q 'class VACommitmentEdge' backend/app/models/entities.py
          grep -q 'executive_commitment_overview' backend/app/services/commitment_graph.py
          grep -q "title: 'VA-owned work · Working now'" android/lib/screens/va_operations_page.dart
          grep -q 'Full-Time VA operator' android/lib/screens/va_operations_page.dart
          grep -q 'VA-owned work' android/lib/screens/va_operations_page.dart
          for contract in \
            backend/tests/test_daily_briefing_integration.py \
            backend/tests/test_v072_release_contract.py \
            backend/tests/test_v080_finance_structure.py \
            backend/tests/test_v081_investments_dashboard_contract.py \
            backend/tests/test_v090_autonomous_core.py \
            backend/tests/test_v090_autonomous_core_contract.py \
            backend/tests/test_v092_calendar_contract.py \
            backend/tests/test_v093_relationship_contract.py \
            backend/tests/test_v094_browser_portal_contract.py \
            backend/tests/test_v095_documents_forms_deadlines_contract.py \
            backend/tests/test_v096_financial_allocation_forecasting_contract.py \
            backend/tests/test_v097_telephony_contract.py \
            backend/tests/test_v098_fulfillment_contract.py \
            backend/tests/test_v101_communications_reliability_contract.py \
            backend/tests/test_v103_logistics_tracking_contract.py \
            backend/tests/test_v104_execution_readiness_contract.py; do
            ! grep -q 'APP_VERSION = "1.0.5"' "$contract"
          done
          git diff --quiet "$SOURCE_BASE" -- .github/workflows/android-release.yml || {
            echo 'Refusing to commit: android-release.yml changed, but this token cannot update workflows.' >&2
            exit 1
          }

      - name: Backend correctness gate
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/va-venv"
          source "$RUNNER_TEMP/va-venv/bin/activate"
          python -m pip install --upgrade pip
          pip install -e './backend[dev]'
          python -m compileall -q backend/app backend/tests
          ruff check backend/app backend/tests --select E9,F63,F7,F82
          PUBLIC_BASE_URL=https://example.invalid \
          PAIRING_SECRET=github-actions-pairing-secret-00000000 \
          TOKEN_ENCRYPTION_KEY=MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE= \
          pytest -q backend/tests

      - name: Commit validated source locally
        run: |
          set -euo pipefail
          git config user.name 'VAAPP Executive Autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing to push: validated source commit unexpectedly changes a workflow file.' >&2
            git diff --cached --name-only -- .github/workflows/ >&2
            exit 1
          fi
          git commit -m 'feat: add autonomous executive commitment graph'
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Flutter
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          for attempt in 1 2 3 4 5; do
            if git clone --filter=blob:none --depth=1 --branch "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_DIR"; then
              break
            fi
            rm -rf "$FLUTTER_DIR"
            if [ "$attempt" -eq 5 ]; then
              echo 'Flutter SDK download failed after five attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" config --no-analytics
          "$FLUTTER_DIR/bin/flutter" precache --android

      - name: Prepare Android release signing
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/full-time-va-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Analyze, test and build Android v1.0.6
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          cd android
          flutter create --platforms=android --org com.fulltimeva --project-name full_time_va .
          cp tooling/app-build.gradle.kts android/app/build.gradle.kts
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp "tooling/app_icon/ic_launcher_${density}.png" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "tooling/app_icon/ic_launcher_${density}.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          for attempt in 1 2 3 4 5; do
            if (cd android && ./gradlew --version); then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            rm -rf "$HOME/.gradle/wrapper/dists"
            sleep $((attempt * 10))
          done
          for attempt in 1 2 3; do
            if flutter build apk --release; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.6.apk"
          sha256sum "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.6.apk" \
            | tee "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.6.apk.sha256"

      - name: Push validated release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/git-askpass-push.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass-push.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass-push.sh" GIT_TERMINAL_PROMPT=0 \
            git push origin HEAD:main
          rm -f "$RUNNER_TEMP/git-askpass-push.sh"

      - name: Publish Android v1.0.6 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="va-android-106-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.6.apk" \
            "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.6.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "Full-Time VA Android v1.0.6 · Executive Commitment Graph" \
            --notes "Validated v1.0.6 release for commit $RELEASE_COMMIT. Adds the autonomous executive commitment graph, ranked work ownership, provider/counterparty follow-through, internal blocker ownership, evidence-gated closure, and commitment-aware briefings." \
            --prerelease
          {
            echo '## v1.0.6 ready'
            echo
            echo "Commit: $RELEASE_COMMIT"
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
