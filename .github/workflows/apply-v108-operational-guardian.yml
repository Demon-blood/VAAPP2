name: Apply v1.0.8 Operational Guardian

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v108-operational-guardian.yml'

permissions:
  contents: write

concurrency:
  group: apply-v108-operational-guardian
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLUTTER_VERSION: '3.38.7'
      INSTALLER_PATH: '.github/workflows/apply-v108-operational-guardian.yml'
      SOURCE_BASE: '2b22b69833bfd57aa574bc702324acb025dc2ec1'
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out installer commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git fetch --no-tags --depth=1 origin "$SOURCE_BASE"
          git checkout --detach "$GITHUB_SHA"
          rm -f "$RUNNER_TEMP/git-askpass.sh"
      - name: Fail closed on v1.0.7 source drift
        run: |
          set -euo pipefail
          test -f "$INSTALLER_PATH" || {
            echo "Refusing to patch: $INSTALLER_PATH is not present in the triggering commit" >&2
            exit 1
          }
          mapfile -t changed < <(git diff --name-only "$SOURCE_BASE" HEAD)
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/apply-v108-operational-guardian.yml) ;;
              *)
                echo "Refusing to patch: application source drift since $SOURCE_BASE: $path" >&2
                exit 1
                ;;
            esac
          done
          test "$(git show "$SOURCE_BASE":backend/app/core/version.py | tr -d '\r')" = $'APP_VERSION = "1.0.7"\nREQUIRED_ANDROID_VERSION = "1.0.7"'
          test "$(git show "$SOURCE_BASE":android/pubspec.yaml | grep '^version:')" = 'version: 1.0.7+50'
          test "$(cat backend/app/core/version.py | tr -d '\r')" = $'APP_VERSION = "1.0.7"\nREQUIRED_ANDROID_VERSION = "1.0.7"'
          test "$(grep '^version:' android/pubspec.yaml)" = 'version: 1.0.7+50'
          grep -q '_DOMAIN = "standing_authority"' backend/app/services/standing_authority.py
          grep -q 'apply_standing_authority_objectives' backend/app/services/autonomous_core.py
      - name: Apply guarded v1.0.8 source patch
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/operational_guardian.py
          printf '%s' '' | base64 --decode > /tmp/test_v108_operational_guardian.py
          printf '%s' '' | base64 --decode > /tmp/test_v108_operational_guardian_contract.py
          printf '%s' '' | base64 --decode > /tmp/V1.0.8_OPERATIONAL_GUARDIAN_AND_CONSENT_CONTINUITY.md
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/apply-v108.py"
          echo '3be3c0875c0f049867f41a87aeef901d01400b50c78ecc1b69f4c83d097bbc25  /tmp/operational_guardian.py' | sha256sum -c -
          echo '86ee06a18cc8e4279f76e4838d6d2aada68f49c36fa48082bc028261b4653f36  /tmp/test_v108_operational_guardian.py' | sha256sum -c -
          echo '6c63fcf4ce806e19f43085d9cc8c865468207c62211d8408472624bea62fb73c  /tmp/test_v108_operational_guardian_contract.py' | sha256sum -c -
          echo '3fdb21f8a9513daf6dbe1c8e731975b6620aa256fe15dd35eb8fdb963d49a111  /tmp/V1.0.8_OPERATIONAL_GUARDIAN_AND_CONSENT_CONTINUITY.md' | sha256sum -c -
          printf '%s  %s\n' '6e44cdf8f66cf6fdc9a4ddb737e0735055bbe20807915081176c39fa295e70fc' "$RUNNER_TEMP/apply-v108.py" | sha256sum -c -
          python3 -m py_compile "$RUNNER_TEMP/apply-v108.py" /tmp/operational_guardian.py /tmp/test_v108_operational_guardian.py /tmp/test_v108_operational_guardian_contract.py
          python3 "$RUNNER_TEMP/apply-v108.py"
          git diff --check
          grep -q 'APP_VERSION = "1.0.8"' backend/app/core/version.py
          grep -q 'version: 1.0.8+51' android/pubspec.yaml
          grep -q 'operational_guardian_job' backend/app/services/scheduler.py
          grep -q 'Operational continuity' android/lib/screens/va_operations_page.dart
          git diff --quiet HEAD -- .github/workflows || { echo 'Refusing to continue: v1.0.8 patch changed a GitHub workflow file.' >&2; git diff --name-only HEAD -- .github/workflows >&2; exit 1; }
      - name: Backend correctness gate
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/va-venv"
          source "$RUNNER_TEMP/va-venv/bin/activate"
          python -m pip install --upgrade pip
          pip install -e './backend[dev]'
          python -m compileall -q backend/app backend/tests
          ruff check backend/app backend/tests --select E9,F63,F7,F82
          PUBLIC_BASE_URL=https://example.invalid \
          PAIRING_SECRET=github-actions-pairing-secret-00000000 \
          TOKEN_ENCRYPTION_KEY=MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE= \
          pytest -q backend/tests
      - name: Commit validated source locally
        run: |
          set -euo pipefail
          git config user.name 'VAAPP Operational Guardian'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing to push: validated source commit unexpectedly changes a workflow file.' >&2
            git diff --cached --name-only -- .github/workflows/ >&2
            exit 1
          fi
          git commit -m 'feat: add operational guardian and consent continuity'
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install Flutter 3.38.7
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          for attempt in 1 2 3 4 5; do
            if git clone --filter=blob:none --depth=1 --branch "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_DIR"; then
              break
            fi
            rm -rf "$FLUTTER_DIR"
            if [ "$attempt" -eq 5 ]; then
              echo 'Flutter SDK download failed after five attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" config --no-analytics
          "$FLUTTER_DIR/bin/flutter" precache --android
      - name: Prepare signing
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/vaapp-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Analyze, test and build Android v1.0.8
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          cd android
          flutter create --platforms=android --org com.fulltimeva --project-name full_time_va .
          cp tooling/app-build.gradle.kts android/app/build.gradle.kts
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp "tooling/app_icon/ic_launcher_${density}.png" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "tooling/app_icon/ic_launcher_${density}.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          for attempt in 1 2 3 4 5; do
            if (cd android && ./gradlew --version); then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            rm -rf "$HOME/.gradle/wrapper/dists"
            sleep $((attempt * 10))
          done
          for attempt in 1 2 3; do
            if flutter build apk --release; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.8.apk"
          sha256sum "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.8.apk" \
            | tee "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.8.apk.sha256"
      - name: Push validated release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/git-askpass-push.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass-push.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass-push.sh" GIT_TERMINAL_PROMPT=0 \
            git push origin HEAD:main
          rm -f "$RUNNER_TEMP/git-askpass-push.sh"
      - name: Publish Android v1.0.8 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="va-android-108-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.8.apk" \
            "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.8.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "Full-Time VA Android v1.0.8 · Operational Guardian" \
            --notes "Validated v1.0.8 release for commit $RELEASE_COMMIT. Adds consent-expiry continuity, provider-state-verified renewal objectives, safe workflow cadence self-healing, and an Android reliability view while keeping system recovery VA-owned and genuine provider authorization in Needs You." \
            --prerelease
          {
            echo '## v1.0.8 ready'
            echo
            echo "Commit: $RELEASE_COMMIT"
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
