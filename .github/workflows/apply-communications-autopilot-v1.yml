              "android/android/app/src/main/kotlin/com/fulltimeva/full_time_va/MainActivity.kt",
              "android/android/app/src/main/kotlin/com/fulltimeva/full_time_va/SmsReceiver.kt",
              "android/lib/screens/communications_page.dart",
              "android/lib/screens/message_conversations_page.dart",
              "android/lib/screens/tasks_page.dart",
              "android/lib/services/background_service.dart",
              "android/lib/widgets/daily_briefing_card.dart",
              "android/pubspec.yaml",
              "docs/COMMUNICATIONS_AUTOPILOT_V2.md",
          }
          staged = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          bad = [p for p in staged if p not in allowed_exact and not p.startswith("backend/tests/")]
          if bad:
              raise SystemExit(f"Refusing unexpected staged paths: {bad}")
          PY

          git config user.name "VAAPP Communications Autopilot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: add communications autopilot and human briefings"
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:main"
          echo "NEW_SHA=$NEW_SHA" >> "$GITHUB_ENV"

      - name: Publish validated APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="va-android-v1.0.5-build48-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.5-build48.apk" \
            "$GITHUB_WORKSPACE/Full-Time-VA-Android-v1.0.5-build48.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$NEW_SHA" \
            --title "Full-Time VA Android v1.0.5+48 · Communications Autopilot" \
            --notes "Validated backend + Flutter release implementing quiet communications autonomy, human briefings, backlog repair and SMS/MMS conversations." \
            --prerelease
          {
            echo '## Communications Autopilot installed'
            echo
            echo "Commit: $NEW_SHA"
            echo "APK release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
