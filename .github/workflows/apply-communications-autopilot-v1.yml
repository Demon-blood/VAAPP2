name: Apply Communications Autopilot v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-communications-autopilot-v1.yml'

permissions:
  contents: write

concurrency:
  group: apply-communications-autopilot-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FLUTTER_VERSION: '3.38.7'
      INSTALLER_PATH: '.github/workflows/apply-communications-autopilot-v1.yml'
      EXPECTED_BASE: 'beb42bf70f9e814f437dc32a3c8f1f4a9c438124'
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out installer commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          rm -f "$RUNNER_TEMP/git-askpass.sh"

      - name: Fail closed unless installer is directly on the verified baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE" || {
            echo "Refusing to patch: installer parent is not $EXPECTED_BASE" >&2
            exit 1
          }
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$INSTALLER_PATH"
          test "$(git show HEAD^:backend/app/core/version.py | tr -d '\r')" = $'APP_VERSION = "1.0.5"\nREQUIRED_ANDROID_VERSION = "1.0.5"'

      - name: Apply guarded source patch
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations
          from pathlib import Path
          ROOT = Path.cwd()
          
          def path(name: str) -> Path:
              return ROOT / name
          
          def replace(name: str, old: str, new: str, *, count: int = 1) -> None:
              p = path(name)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"Patch guard failed for {name}: expected at least {count}, found {actual}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")
          
          def write(name: str, content: str) -> None:
              p = path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")
          write('backend/app/services/communication_attention.py', 'from __future__ import annotations\n\nimport re\nfrom typing import Any\n\n_HISTORY_PROVIDERS = {"android_sms_history", "android_mms_history", "android_call_log"}\n_OTP_TERMS = (\n    "one-time code", "one time code", "otp", "verification code", "verificatiecode",\n    "beveiligingscode", "security code", "2fa", "auth code", "authentication code",\n    "code de vérification", "code de securite", "code de sécurité",\n)\n_FRAUD_TERMS = (\n    "fraud", "fraude", "unauthorized", "unauthorised", "not authorized", "not authorised", "niet door u", "niet door jou",\n    "suspicious transaction", "verdachte transactie", "card stolen", "kaart gestolen",\n    "account compromised", "rekening gehackt", "security breach", "beveiligingsincident",\n)\n_FINANCIAL_CONFIRMATION_TERMS = (\n    "payment received", "payment completed", "payment successful", "payment processed",\n    "betaling ontvangen", "betaling voltooid", "betaling geslaagd", "betaling verwerkt",\n    "transfer completed", "transfer successful", "overschrijving uitgevoerd", "overschrijving voltooid",\n    "withdrawal completed", "withdrawal processed", "opname voltooid", "opname verwerkt",\n    "purchase confirmed", "transaction completed", "transactie voltooid", "card payment",\n)\n_ROUTINE_STATUS_TERMS = (\n    "ticket confirmed", "booking confirmed", "reservation confirmed", "appointment confirmed",\n    "afspraak bevestigd", "reservering bevestigd", "bestelling bevestigd", "order confirmed",\n    "shipped", "dispatched", "out for delivery", "delivered", "verzonden", "geleverd",\n    "ready for pickup", "klaar om af te halen", "your receipt", "uw ontvangstbewijs",\n)\n_REQUEST_TERMS = (\n    "please ", "can you", "could you", "would you", "will you", "reply", "respond",\n    "laat weten", "kun je", "kan je", "kunt u", "wil je", "wilt u", "bevestig",\n    "confirmez", "pouvez-vous", "répondez", "repondez",\n)\n_PROMO_TERMS = (\n    "unsubscribe", "uitschrijven", "afmelden", "stop to opt out", "reply stop", "promo",\n    "promotion", "aanbieding", "korting", "discount", "sale", "% off", "deal",\n)\n_PAID_SUBSCRIPTION_TERMS = (\n    "renewal", "renews", "renewed", "verlenging", "wordt verlengd", "next charge",\n    "volgende betaling", "billing", "factur", "charged", "in rekening", "monthly",\n    "maandelijks", "annual", "yearly", "jaarlijks", "price", "prijs",\n)\n_AMOUNT_RE = re.compile(r"(?:€|eur\\s*)\\s*\\d|\\d[\\d., ]*\\s*(?:€|eur)\\b", re.I)\n\n\ndef _has_any(text: str, terms: tuple[str, ...]) -> bool:\n    return any(term in text for term in terms)\n\n\ndef normalize_communication_attention(payload: Any, decision: dict[str, Any]) -> dict[str, Any]:\n    """Separate protection/retention from actual human interruption.\n\n    A sensitive message can be protected and still require no user work. Immediate\n    interruption is reserved for a credible urgent risk or a genuinely blocking request.\n    """\n    normalized = dict(decision)\n    body = str(getattr(payload, "body", "") or "")\n    lower = body.casefold()\n    provider = str(getattr(payload, "provider", "") or "").casefold()\n    direction = str(getattr(payload, "direction", "incoming") or "incoming").casefold()\n    channel = str(getattr(payload, "channel", "") or "").casefold()\n    event_type = str(getattr(payload, "event_type", "") or "").casefold()\n\n    protected = bool(normalized.get("protected"))\n    action_required = bool(normalized.get("action_required"))\n    interrupt = False\n    attention_reason = str(normalized.get("reasoning_summary") or "")[:500]\n\n    if direction != "incoming" or provider in _HISTORY_PROVIDERS:\n        action_required = False\n    elif channel == "call":\n        # Call disposition is handled by the call policy. A call record itself is evidence.\n        action_required = event_type in {"missed_call", "blocked_call"} and bool(normalized.get("action_required"))\n    elif _has_any(lower, _FRAUD_TERMS):\n        protected = True\n        action_required = True\n        interrupt = True\n        normalized["priority"] = "urgent"\n        attention_reason = "Credible fraud/security wording needs immediate human judgment."\n    elif _has_any(lower, _OTP_TERMS):\n        protected = True\n        action_required = False\n        attention_reason = "Authentication code retained as protected evidence; blocking auth is owned by the active objective, not by this message."\n    elif _has_any(lower, _FINANCIAL_CONFIRMATION_TERMS) and not _has_any(lower, _REQUEST_TERMS):\n        protected = True\n        action_required = False\n        attention_reason = "Financial confirmation retained as protected evidence; no reply or manual task is implied."\n    elif _has_any(lower, _ROUTINE_STATUS_TERMS) and not _has_any(lower, _REQUEST_TERMS):\n        action_required = False\n        attention_reason = "Routine status/confirmation recorded for the briefing without creating user work."\n    elif str(normalized.get("category") or "").casefold() in {"private/hidden notification", "notification"}:\n        protected = bool(normalized.get("protected"))\n        action_required = False\n        attention_reason = "Notification content is retained, but hidden/routine notification metadata is not itself a task."\n\n    # If the VA already has a safe reply it can execute, ownership stays with the VA.\n    if normalized.get("auto_reply_safe") and normalized.get("reply_text"):\n        action_required = False\n\n    # Relationship policy may require review, but it is a scheduled briefing item unless\n    # the content is independently urgent. Do not turn preference uncertainty into a buzz.\n    if normalized.get("relationship_review_required"):\n        action_required = True\n\n    if action_required and str(normalized.get("priority") or "").casefold() == "urgent":\n        interrupt = True\n\n    normalized["protected"] = protected\n    normalized["action_required"] = action_required\n    normalized["interrupt"] = interrupt\n    normalized["routine_evidence"] = direction == "incoming" and not action_required\n    normalized["attention_reason"] = attention_reason\n    if protected:\n        normalized["auto_reply_safe"] = False\n        normalized["reply_text"] = None\n    normalized["delete_from_device"] = bool(\n        direction == "incoming"\n        and not protected\n        and not action_required\n        and (\n            bool(normalized.get("spam"))\n            or str(normalized.get("category") or "").casefold() in {"spam", "promotion", "promotions"}\n        )\n        and _has_any(lower, _PROMO_TERMS)\n    )\n    return normalized\n\n\ndef is_marketing_subscription_false_positive(\n    *, sender: str, subject: str, body: str, subscription: dict[str, Any] | None\n) -> bool:\n    """Return True when an email footer/list control was mistaken for a paid subscription."""\n    if not subscription:\n        return False\n    text = f"{sender}\\n{subject}\\n{body[:12000]}".casefold()\n    if not _has_any(text, _PROMO_TERMS):\n        return False\n    if _has_any(text, _PAID_SUBSCRIPTION_TERMS) or _AMOUNT_RE.search(text):\n        return False\n    provider = str(subscription.get("provider_name") or subscription.get("provider") or "").casefold()\n    description = str(subscription.get("description") or "").casefold()\n    return "unsubscribe" in text or "uitschrijven" in text or "afmelden" in text or "newsletter" in provider + description\n')
          write('backend/app/services/briefing_policy.py', 'from __future__ import annotations\n\nfrom typing import Any\n\nfrom app.services.runtime_config import get_runtime_value\n\n\n_ALLOWED_NEEDS_YOU = {\n    "payment_authorization",\n    "payment_reconciliation",\n    "transfer_authorization",\n    "transfer_reconciliation",\n    "task_approval",\n    "provider_authorization",\n    "funding_required",\n}\n\n\ndef filter_needs_you(items: list[dict[str, Any]]) -> list[dict[str, Any]]:\n    """Keep Needs You for genuine human authority/auth/material requirements only."""\n    result: list[dict[str, Any]] = []\n    seen: set[tuple[str, str, str]] = set()\n    for item in items:\n        kind = str(item.get("type") or "")\n        if kind == "autopilot_exception":\n            # Infrastructure/provider defects remain system-owned. Only an explicitly\n            # user-required blocker is allowed to cross the human boundary.\n            if str(item.get("classification") or "") != "user_required":\n                continue\n        elif kind not in _ALLOWED_NEEDS_YOU:\n            continue\n        if kind == "provider_authorization" and str(item.get("id") or "") == "ai_primary":\n            continue\n        signature = (kind, str(item.get("id") or ""), str(item.get("title") or ""))\n        if signature in seen:\n            continue\n        seen.add(signature)\n        result.append(item)\n    return result\n\n\ndef human_briefing_summary(\n    stats: dict[str, Any],\n    payments: list[dict[str, Any]],\n    upcoming_bills: list[Any],\n    needs_you: list[dict[str, Any]],\n    *,\n    period: str = "daily",\n) -> str:\n    parts: list[str] = []\n    needs = len(needs_you)\n    if needs == 0:\n        parts.append("You are clear right now; routine work is staying with the VA.")\n    else:\n        parts.append(f"I have {needs} item{\'s\' if needs != 1 else \'\'} that genuinely need your authority or input.")\n\n    mail = int(stats.get("emails_received") or 0)\n    messages = int(stats.get("messages_received") or 0)\n    replies = int(stats.get("replies_sent") or 0) + int(stats.get("communication_replies_sent") or 0)\n    if mail or messages:\n        parts.append(\n            f"I reviewed {mail} email{\'s\' if mail != 1 else \'\'} and {messages} message{\'s\' if messages != 1 else \'\'}"\n            + (f", and sent {replies} verified repl{\'ies\' if replies != 1 else \'y\'}" if replies else "")\n            + "."\n        )\n\n    completed_payments = [row for row in payments if str(row.get("status") or "").casefold() == "completed"]\n    pending_payments = [\n        row for row in payments\n        if str(row.get("status") or "").casefold() not in {"completed", "failed", "cancelled", "rejected"}\n    ]\n    if completed_payments:\n        parts.append(f"{len(completed_payments)} payment{\'s were\' if len(completed_payments) != 1 else \' was\'} verified completed.")\n    if pending_payments:\n        parts.append(f"{len(pending_payments)} payment item{\'s are\' if len(pending_payments) != 1 else \' is\'} still being tracked; I have not treated them as completed.")\n    if upcoming_bills:\n        parts.append(f"I am watching {len(upcoming_bills)} bill{\'s\' if len(upcoming_bills) != 1 else \'\'} due within seven days.")\n\n    calendar = int(stats.get("calendar_changes") or 0)\n    if calendar:\n        parts.append(f"I updated {calendar} calendar item{\'s\' if calendar != 1 else \'\'} from incoming information.")\n    provider_problems = int(stats.get("provider_problems") or 0)\n    if provider_problems:\n        parts.append(f"There {\'are\' if provider_problems != 1 else \'is\'} {provider_problems} provider/system issue{\'s\' if provider_problems != 1 else \'\'}; I am keeping those system-owned unless they truly require you.")\n    return " ".join(parts)\n\n\nasync def briefing_period_schedule(db, local_now) -> list[dict[str, Any]]:\n    defaults = {\n        "morning": ("false", "8"),\n        "afternoon": ("false", "14"),\n        "evening": ("true", "19"),\n    }\n    periods: list[dict[str, Any]] = []\n    for name, (enabled_default, hour_default) in defaults.items():\n        enabled = (await get_runtime_value(db, f"briefing_{name}_enabled", enabled_default)).casefold() == "true"\n        try:\n            hour = max(0, min(int(await get_runtime_value(db, f"briefing_{name}_hour_local", hour_default)), 23))\n        except ValueError:\n            hour = int(hour_default)\n        periods.append({\n            "name": name,\n            "enabled": enabled,\n            "hour_local": hour,\n            "ready": enabled and local_now.hour >= hour,\n            "delivery_key": f"{local_now.date().isoformat()}:{name}",\n        })\n    return periods\n')
          write('backend/app/services/communication_backlog_repair.py', 'from __future__ import annotations\n\nimport json\nfrom types import SimpleNamespace\n\nfrom sqlalchemy import select\nfrom sqlalchemy.ext.asyncio import AsyncSession\n\nfrom app.models.entities import CommunicationEvent, EmailMessage, Task\nfrom app.services.audit import write_audit\nfrom app.services.communication_attention import normalize_communication_attention\n\n_OTP_TASK_TERMS = (\n    "one-time code", "one time code", "otp", "verification code", "verificatiecode",\n    "security code", "beveiligingscode", "2fa",\n)\n_PROVIDER_ERROR_TERMS = (\n    "groq", "gemini", "ai provider", "quota", "rate limit", "timeout", "google drive",\n    "drive archive", "provider error", "api error", "connection error",\n)\n\n\nasync def repair_communication_backlog(db: AsyncSession) -> dict[str, int]:\n    """Repair legacy projections without deleting source evidence."""\n    cancelled_tasks = 0\n    repaired_events = 0\n    tasks = list(\n        (\n            await db.execute(\n                select(Task).where(Task.status.in_(["open", "waiting"]))\n            )\n        ).scalars()\n    )\n    for task in tasks:\n        source_type = str(task.source_type or "").casefold()\n        text = f"{task.title}\\n{task.description}".casefold()\n        cancel = False\n        reason = ""\n        if source_type == "communication":\n            cancel = True\n            reason = "legacy device-message Task superseded by canonical CommunicationEvent ownership"\n        elif source_type in {"ai_review", "email_ai_review"}:\n            cancel = True\n            reason = "AI/provider availability is system-owned and is not a human task"\n        elif source_type == "email_archive" and any(term in text for term in _PROVIDER_ERROR_TERMS):\n            cancel = True\n            reason = "document/provider failure remains system-owned"\n        elif source_type != "manual" and any(term in text for term in _OTP_TASK_TERMS):\n            cancel = True\n            reason = "authentication-code message is evidence; any active auth blocker is owned by its objective"\n        elif source_type == "email_reply" and task.source_id:\n            email = (\n                await db.execute(\n                    select(EmailMessage).where(EmailMessage.provider_message_id == task.source_id).limit(1)\n                )\n            ).scalar_one_or_none()\n            if email is not None:\n                try:\n                    saved = json.loads(email.analysis_json or "{}")\n                except json.JSONDecodeError:\n                    saved = {}\n                if email.status == "replied" or not saved.get("reply"):\n                    cancel = True\n                    reason = "saved email no longer has an unresolved reply decision"\n        if cancel:\n            task.status = "cancelled"\n            task.requires_approval = False\n            cancelled_tasks += 1\n            await write_audit(\n                db,\n                "communication_backlog_task_cancelled",\n                entity_type="task",\n                entity_id=str(task.id),\n                result="superseded",\n                details={"source_type": task.source_type, "reason": reason},\n            )\n\n    events = list(\n        (\n            await db.execute(\n                select(CommunicationEvent).where(CommunicationEvent.action_required.is_(True))\n            )\n        ).scalars()\n    )\n    for event in events:\n        try:\n            decision = json.loads(event.decision_json or "{}")\n        except json.JSONDecodeError:\n            continue\n        payload = SimpleNamespace(\n            body=event.body,\n            provider=event.provider,\n            direction=event.direction,\n            channel=event.channel,\n            event_type=event.event_type,\n        )\n        repaired = normalize_communication_attention(payload, decision)\n        if bool(repaired.get("action_required")) == bool(event.action_required):\n            continue\n        event.action_required = bool(repaired.get("action_required"))\n        event.protected = bool(repaired.get("protected"))\n        event.decision_json = json.dumps(repaired, ensure_ascii=False, separators=(",", ":"))\n        repaired_events += 1\n\n    if cancelled_tasks or repaired_events:\n        await write_audit(\n            db,\n            "communication_backlog_repaired",\n            entity_type="communications",\n            entity_id="canonical",\n            details={"cancelled_tasks": cancelled_tasks, "repaired_events": repaired_events},\n        )\n        await db.commit()\n    return {"cancelled_tasks": cancelled_tasks, "repaired_events": repaired_events}\n')
          write('android/lib/screens/message_conversations_page.dart', "import 'package:flutter/material.dart';\nimport 'package:provider/provider.dart';\n\nimport '../app_state.dart';\nimport '../theme/va_theme.dart';\n\nclass MessageConversationsPage extends StatefulWidget {\n  const MessageConversationsPage({super.key});\n\n  @override\n  State<MessageConversationsPage> createState() => _MessageConversationsPageState();\n}\n\nclass _MessageConversationsPageState extends State<MessageConversationsPage> {\n  final _search = TextEditingController();\n\n  @override\n  void dispose() {\n    _search.dispose();\n    super.dispose();\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    final state = context.watch<AppState>();\n    final conversations = _conversations(state);\n    final query = _search.text.trim().toLowerCase();\n    final filtered = query.isEmpty\n        ? conversations\n        : conversations.where((row) {\n            final haystack = '${row.name} ${row.address} ${row.preview}'.toLowerCase();\n            return haystack.contains(query);\n          }).toList();\n    return Scaffold(\n      appBar: AppBar(title: const Text('SMS/MMS conversations')),\n      body: RefreshIndicator(\n        onRefresh: () => context.read<AppState>().refreshCommunications(syncDeviceHistory: true),\n        child: ListView(\n          physics: const AlwaysScrollableScrollPhysics(),\n          padding: const EdgeInsets.fromLTRB(12, 10, 12, 28),\n          children: [\n            TextField(\n              controller: _search,\n              onChanged: (_) => setState(() {}),\n              decoration: const InputDecoration(\n                hintText: 'Search people or message text…',\n                prefixIcon: Icon(Icons.search_rounded),\n              ),\n            ),\n            const SizedBox(height: 10),\n            if (filtered.isEmpty)\n              const Card(\n                child: ListTile(\n                  leading: Icon(Icons.sms_outlined),\n                  title: Text('No SMS/MMS conversations synced yet'),\n                  subtitle: Text('Pull to refresh. SMS and MMS history are grouped by person or phone number.'),\n                ),\n              )\n            else\n              for (final conversation in filtered)\n                Card(\n                  child: ListTile(\n                    leading: CircleAvatar(child: Text(_initials(conversation.name))),\n                    title: Text(\n                      conversation.name,\n                      maxLines: 1,\n                      overflow: TextOverflow.ellipsis,\n                      style: const TextStyle(fontWeight: FontWeight.w800),\n                    ),\n                    subtitle: Text(\n                      conversation.preview,\n                      maxLines: 2,\n                      overflow: TextOverflow.ellipsis,\n                    ),\n                    trailing: Column(\n                      mainAxisAlignment: MainAxisAlignment.center,\n                      crossAxisAlignment: CrossAxisAlignment.end,\n                      children: [\n                        Text(_stamp(conversation.lastAt), style: const TextStyle(fontSize: 11, color: VaTheme.textMuted)),\n                        if (conversation.hasMms)\n                          const Padding(\n                            padding: EdgeInsets.only(top: 4),\n                            child: Text('MMS', style: TextStyle(fontSize: 10, color: VaTheme.secondary, fontWeight: FontWeight.w800)),\n                          ),\n                      ],\n                    ),\n                    onTap: () => Navigator.of(context).push(\n                      MaterialPageRoute<void>(\n                        builder: (_) => _ConversationPage(conversation: conversation),\n                      ),\n                    ),\n                  ),\n                ),\n          ],\n        ),\n      ),\n    );\n  }\n\n  List<_Conversation> _conversations(AppState state) {\n    final byPhone = <String, String>{};\n    for (final relationship in state.relationships) {\n      final phone = _digits('${relationship['primary_phone'] ?? ''}');\n      final name = '${relationship['display_name'] ?? ''}'.trim();\n      if (phone.isNotEmpty && name.isNotEmpty) byPhone[phone] = name;\n    }\n\n    final groups = <String, List<Map<String, dynamic>>>{};\n    for (final event in state.communications) {\n      final channel = '${event['channel'] ?? ''}'.toLowerCase();\n      final type = '${event['event_type'] ?? ''}'.toLowerCase();\n      if (channel != 'sms' || !{'message', 'mms'}.contains(type)) continue;\n      final incoming = '${event['direction'] ?? ''}' != 'outgoing';\n      final address = '${incoming ? event['sender'] : event['recipient'] ?? ''}'.trim();\n      final rawKey = '${event['thread_key'] ?? ''}'.trim();\n      final key = rawKey.isNotEmpty ? rawKey : _digits(address);\n      if (key.isEmpty) continue;\n      groups.putIfAbsent(key, () => <Map<String, dynamic>>[]).add(event);\n    }\n\n    final result = <_Conversation>[];\n    for (final entry in groups.entries) {\n      final messages = entry.value\n        ..sort((a, b) => _date(a).compareTo(_date(b)));\n      final latest = messages.last;\n      final incoming = '${latest['direction'] ?? ''}' != 'outgoing';\n      final address = '${incoming ? latest['sender'] : latest['recipient'] ?? ''}'.trim();\n      final normalized = _digits(address);\n      String? name = byPhone[normalized];\n      if (name == null && normalized.length >= 8) {\n        final suffix = normalized.substring(normalized.length - 8);\n        for (final candidate in byPhone.entries) {\n          if (candidate.key.endsWith(suffix)) {\n            name = candidate.value;\n            break;\n          }\n        }\n      }\n      final body = '${latest['body'] ?? ''}'.trim();\n      result.add(\n        _Conversation(\n          address: address,\n          name: name ?? (address.isEmpty ? 'Unknown sende