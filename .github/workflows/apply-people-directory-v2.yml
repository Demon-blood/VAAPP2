name: Apply People Directory v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out main without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git fetch --no-tags --depth=1 origin main
          git checkout -B main FETCH_HEAD

      - name: Verify installer baseline and repository state
        env:
          EXPECTED_BASELINE: bc7c9d609d7e401741277e8370f95be0c1988d80
          INSTALLER_PATH: .github/workflows/apply-people-directory-v2.yml
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          echo "Installer commit: $current"
          echo "Installer parent: $parent"
          if [ "$parent" != "$EXPECTED_BASELINE" ]; then
            echo "Refusing to apply: installer parent is not the verified VAAPP baseline $EXPECTED_BASELINE." >&2
            echo "Current parent is $parent. No source files have been changed by this workflow." >&2
            exit 1
          fi
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASELINE" HEAD)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "$INSTALLER_PATH" ]; then
            echo "Refusing to apply: the installer commit contains changes other than $INSTALLER_PATH:" >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi

      - name: Install People directory implementation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          files = {
              "backend/app/models/people_entities.py": "",
              "backend/app/services/contact_directory.py": "",
              "backend/app/core/database.py": "",
              "backend/app/api/v105_routes.py": "",
              "android/android/app/src/main/kotlin/com/fulltimeva/full_time_va/VaContacts.kt": "",
              "android/android/app/src/main/kotlin/com/fulltimeva/full_time_va/MainActivity.kt": "",
              "android/lib/screens/people_directory_page.dart": "",
              "android/lib/screens/home_shell.dart": "",
              "backend/tests/test_people_directory.py": "",
              "backend/tests/test_people_directory_contract.py": "",
              "docs/PEOPLE_DIRECTORY.md": ""
          }
          for relative, encoded in files.items():
              target = Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))
              print("wrote", relative)
          PY
          rm -f .github/workflows/apply-people-directory-v2.yml
          python3 -m compileall -q backend/app backend/tests
          git diff --check

      - name: Run backend gate before push
        env:
          PUBLIC_BASE_URL: https://example.invalid
          PAIRING_SECRET: installer-test-pairing-secret-00000000
          TOKEN_ENCRYPTION_KEY: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/people-venv"
          source "$RUNNER_TEMP/people-venv/bin/activate"
          python -m pip install --upgrade pip
          pip install -e './backend[dev]'
          python -m compileall -q backend/app backend/tests
          ruff check backend/app backend/tests --select E9,F63,F7,F82
          pytest -q backend/tests

      - name: Install Flutter for pre-push validation
        run: |
          set -euo pipefail
          FLUTTER_VERSION='3.38.7'
          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          for attempt in 1 2 3 4 5; do
            if git clone --filter=blob:none --depth=1 --branch "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_DIR"; then
              break
            fi
            rm -rf "$FLUTTER_DIR"
            if [ "$attempt" -eq 5 ]; then
              echo "Flutter SDK download failed after five attempts; refusing to push unvalidated Android changes." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" config --no-analytics
          "$FLUTTER_DIR/bin/flutter" --version

      - name: Run Flutter gate before push
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          cd android
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Recheck main before commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin main
          remote="$(git rev-parse origin/main)"
          local="$(git rev-parse HEAD)"
          if [ "$remote" != "$local" ]; then
            echo "Refusing to push because main changed while validation was running." >&2
            echo "Workflow checkout: $local" >&2
            echo "Current origin/main: $remote" >&2
            exit 1
          fi

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add People directory and phone contact sync"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git push origin HEAD:main
          rm -f "$RUNNER_TEMP/git-askpass.sh"

      - name: Result
        run: |
          echo "People directory committed to main after backend and Flutter pre-push gates passed."
          echo "The existing Android release workflow will now run the signed APK build from the committed tree."
