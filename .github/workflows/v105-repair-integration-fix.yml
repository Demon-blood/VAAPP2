name: v1.0.5 Integration Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v105-repair-integration-fix.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Verify current unrepaired state
        run: |
          set -euo pipefail
          grep -F 'APP_VERSION = "1.0.4"' backend/app/core/version.py
          grep -F 'version: 1.0.4+46' android/pubspec.yaml
          test -f repair_v105_after_partial_upload.py
          test -f backend/tests/test_v105_human_boundary_relationship_contract.py
          git diff --quiet
          git diff --cached --quiet

      - name: Apply v1.0.5 product repair in memory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          script = Path("repair_v105_after_partial_upload.py").resolve()
          source = script.read_text(encoding="utf-8")
          marker = 'REPAIR_BASE_COMMIT = "3bf8794c21ac30f61e1ccf84e452fc65785187a4"'
          replacement = f'REPAIR_BASE_COMMIT = "{os.environ["GITHUB_SHA"]}"'
          if source.count(marker) != 1:
              raise SystemExit("repair base marker missing or duplicated")
          source = source.replace(marker, replacement, 1)
          ns = {"__name__": "__main__", "__file__": str(script), "__package__": None}
          exec(compile(source, str(script), "exec"), ns, ns)
          PY

      - name: Repair v1.0.5 test contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          tests = root / "backend" / "tests"

          # Historical contract files assert the *current* shipped release identity.
          # v1.0.5 changes that identity, so update only exact release-identity
          # literals; do not rewrite historical doc paths or the verified v1.0.4
          # maintenance-baseline references.
          replacements = {
              'APP_VERSION = "1.0.4"': 'APP_VERSION = "1.0.5"',
              'REQUIRED_ANDROID_VERSION = "1.0.4"': 'REQUIRED_ANDROID_VERSION = "1.0.5"',
              'version = "1.0.4"': 'version = "1.0.5"',
              'version: 1.0.4+46': 'version: 1.0.5+47',
              "const String appRelease = '1.0.4';": "const String appRelease = '1.0.5';",
              "const String minimumBackendVersion = '1.0.4';": "const String minimumBackendVersion = '1.0.5';",
              'Full-Time-VA-Android-v1.0.4.apk': 'Full-Time-VA-Android-v1.0.5.apk',
              'Full-Time VA Android v1.0.4': 'Full-Time VA Android v1.0.5',
              'APP_VERSION == "1.0.4"': 'APP_VERSION == "1.0.5"',
              'REQUIRED_ANDROID_VERSION == "1.0.4"': 'REQUIRED_ANDROID_VERSION == "1.0.5"',
              '"release": "1.0.4"': '"release": "1.0.5"',
              '"android_version": "1.0.4+46"': '"android_version": "1.0.5+47"',
          }

          changed = []
          for p in sorted(tests.glob("test_*.py")):
              text = p.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  p.write_text(updated, encoding="utf-8", newline="\n")
                  changed.append(str(p))

          # v1.0.5 relationship-aware policy now consults RelationshipIdentity.
          # This old unit-test fixture intentionally creates a minimal schema, so
          # include that table rather than weakening production DB error handling.
          p = tests / "test_v061_autonomy_policy.py"
          text = p.read_text(encoding="utf-8")
          old_import = "from app.models.entities import EmailMessage, OperationPreference, RuntimeSetting"
          new_import = "from app.models.entities import EmailMessage, OperationPreference, RelationshipIdentity, RuntimeSetting"
          old_tables = "for table in (RuntimeSetting, OperationPreference, EmailMessage):"
          new_tables = "for table in (RuntimeSetting, OperationPreference, EmailMessage, RelationshipIdentity):"
          if text.count(old_import) != 1 or text.count(old_tables) != 1:
              raise SystemExit("v0.6.1 autonomy fixture anchors changed unexpectedly")
          text = text.replace(old_import, new_import, 1).replace(old_tables, new_tables, 1)
          p.write_text(text, encoding="utf-8", newline="\n")

          # CommunicationEvent is canonical in v1.0.5. New device messages must not
          # recreate the legacy communication Task projection.
          p = tests / "test_v070_communications.py"
          text = p.read_text(encoding="utf-8")
          old = '''    task = (await db.execute(select(Task).where(Task.source_type == "communication"))).scalar_one()
              assert task.requires_approval is True
          '''
          # Keep indentation literal robustly by using the exact two source lines.
          old = (
              '    task = (await db.execute(select(Task).where(Task.source_type == "communication"))).scalar_one()\n'
              '    assert task.requires_approval is True\n'
          )
          new = (
              '    tasks = list((await db.execute(select(Task).where(Task.source_type == "communication"))).scalars())\n'
              '    assert tasks == []\n'
          )
          if text.count(old) != 1:
              raise SystemExit("v0.7 communication legacy-task assertion anchor changed unexpectedly")
          p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          # Preserve both the original production v1.0 verification metadata and
          # the v1.0.4 maintenance baseline in project state.
          state_path = root / "VAAPP_PROJECT_STATE.json"
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state["verified_baseline_commit"] = "66c09040326ac553a1402cd06fa6771344195d45"
          state["verified_baseline_actions_run"] = 41
          state["verified_baseline_actions_conclusion"] = "success"
          state_path.write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8")

          print("Updated release-contract tests:", len(changed))
          PY

      - name: Remove deployment helpers and refresh manifests
        run: |
          set -euo pipefail
          rm -f \
            repair_v105_after_partial_upload.py \
            V105_REPAIR_README.md \
            apply_v105_human_boundary.py \
            V105_DELTA_README.md

          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          root = Path(".")
          excluded = {
              "FILE_MANIFEST.txt",
              "SHA256SUMS.txt",
              "repair_v105_after_partial_upload.py",
              "V105_REPAIR_README.md",
              "apply_v105_human_boundary.py",
              "V105_DELTA_README.md",
          }
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          paths = sorted(p for p in tracked if p not in excluded and (root / p).is_file())

          (root / "FILE_MANIFEST.txt").write_text(
              "".join(f"./{p}\n" for p in paths),
              encoding="utf-8",
          )
          (root / "SHA256SUMS.txt").write_text(
              "".join(
                  f"{hashlib.sha256((root / p).read_bytes()).hexdigest()}  ./{p}\n"
                  for p in paths
              ),
              encoding="utf-8",
          )
          PY

      - name: Run full backend gate
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/v105-integration"
          source "$RUNNER_TEMP/v105-integration/bin/activate"
          python -m pip install --upgrade pip
          pip install -e './backend[dev]'

          python -m compileall -q backend/app backend/tests
          ruff check backend/app backend/tests --select E9,F63,F7,F82

          PUBLIC_BASE_URL=https://example.invalid \
          PAIRING_SECRET=github-actions-pairing-secret-00000000 \
          TOKEN_ENCRYPTION_KEY=MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE= \
          pytest -q backend/tests

      - name: Commit verified v1.0.5 integration to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No repair changes were produced." >&2
            exit 1
          fi

          git commit -m "v1.0.5 — complete Human Boundary & Relationship-Aware Communications"
          echo "REPAIRED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Dispatch canonical Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/android-release.yml/dispatches" \
            -f ref=main
          echo "Backend gate passed and repaired commit ${REPAIRED_SHA} was pushed."
          echo "Canonical Build Android APK workflow dispatched."
