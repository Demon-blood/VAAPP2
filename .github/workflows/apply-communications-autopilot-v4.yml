name: Apply Communications Autopilot v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-communications-autopilot-v4.yml'

permissions:
  contents: write

concurrency:
  group: apply-communications-autopilot-v4
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FLUTTER_VERSION: '3.38.7'
      INSTALLER_PATH: '.github/workflows/apply-communications-autopilot-v4.yml'
      V3_PATH: '.github/workflows/apply-communications-autopilot-v3.yml'
      EXPECTED_BASE: '64d95359f96a6460481fb68cf31128eb1718dc16'
      EXPECTED_V3_SHA256: 'b7b2b2090c548406320c1dbd52f67326d43a114c68476f53ca61fa95ab82fda1'
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out installer commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOS
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh" GIT_TERMINAL_PROMPT=0 \
            git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          rm -f "$RUNNER_TEMP/git-askpass.sh"

      - name: Verify pinned v3 and prepare step extractor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE" || {
            echo "Refusing to patch: installer parent is not $EXPECTED_BASE" >&2
            exit 1
          }
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$INSTALLER_PATH"
          test -f "$V3_PATH"
          test "$(sha256sum "$V3_PATH" | awk '{print $1}')" = "$EXPECTED_V3_SHA256"
          test "$(git show HEAD^:backend/app/core/version.py | tr -d '\r')" = $'APP_VERSION = "1.0.5"\nREQUIRED_ANDROID_VERSION = "1.0.5"'

          cat > "$RUNNER_TEMP/extract-v3-step.py" <<'PY'
          from pathlib import Path
          import sys

          workflow = Path('.github/workflows/apply-communications-autopilot-v3.yml').read_text(encoding='utf-8').splitlines()
          wanted = sys.argv[1]
          marker = f"      - name: {wanted}"
          try:
              start = workflow.index(marker)
          except ValueError as exc:
              raise SystemExit(f"Pinned v3 step not found: {wanted}") from exc
          run_line = None
          for idx in range(start + 1, min(len(workflow), start + 12)):
              if workflow[idx] == "        run: |":
                  run_line = idx
                  break
          if run_line is None:
              raise SystemExit(f"Pinned v3 step has no literal run block: {wanted}")
          body = []
          for line in workflow[run_line + 1:]:
              if line.startswith("      - name: "):
                  break
              body.append(line[10:] if line.startswith("          ") else line)
          if not any(part.strip() for part in body):
              raise SystemExit(f"Pinned v3 step is empty: {wanted}")
          sys.stdout.write("\n".join(body).rstrip() + "\n")
          PY
          python3 -m py_compile "$RUNNER_TEMP/extract-v3-step.py"

      - name: Apply guarded source patch from pinned v3
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/extract-v3-step.py" 'Apply guarded source patch' > "$RUNNER_TEMP/v3-apply.sh"
          bash "$RUNNER_TEMP/v3-apply.sh"

      - name: Run complete backend gate
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/extract-v3-step.py" 'Run complete backend gate' > "$RUNNER_TEMP/v3-backend.sh"
          bash "$RUNNER_TEMP/v3-backend.sh"

      - name: Install Flutter directly
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/extract-v3-step.py" 'Install Flutter directly' > "$RUNNER_TEMP/v3-flutter.sh"
          bash "$RUNNER_TEMP/v3-flutter.sh"

      - name: Prepare release signing
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/extract-v3-step.py" 'Prepare release signing' > "$RUNNER_TEMP/v3-signing.sh"
          bash "$RUNNER_TEMP/v3-signing.sh"

      - name: Analyze, test and compile signed APK
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/extract-v3-step.py" 'Analyze, test and compile signed APK' > "$RUNNER_TEMP/v3-android.sh"
          bash "$RUNNER_TEMP/v3-android.sh"

      - name: Commit validated source with authenticated push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/extract-v3-step.py" 'Commit only validated source and self-remove installer' > "$RUNNER_TEMP/v3-commit-original.sh"
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/unused')
          path = Path(__import__('os').environ['RUNNER_TEMP']) / 'v3-commit-original.sh'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'git rm -f .github/workflows/apply-communications-autopilot-v2.yml\n',
              'git rm -f .github/workflows/apply-communications-autopilot-v2.yml\n'
              'git rm -f .github/workflows/apply-communications-autopilot-v3.yml\n',
              1,
          )
          text = text.replace(
              'allowed_exact = {\n    ".github/workflows/apply-communications-autopilot-v3.yml",',
              'allowed_exact = {\n    ".github/workflows/apply-communications-autopilot-v4.yml",\n'
              '    ".github/workflows/apply-communications-autopilot-v3.yml",',
              1,
          )
          old = 'git push origin "HEAD:main"'
          new = '''cat > "$RUNNER_TEMP/git-push-askpass.sh" <<'EOS'\n#!/usr/bin/env bash\ncase "$1" in\n  *Username*) printf '%s\\n' 'x-access-token' ;;\n  *Password*) printf '%s\\n' "$GH_TOKEN" ;;\nesac\nEOS\nchmod 700 "$RUNNER_TEMP/git-push-askpass.sh"\nGIT_ASKPASS="$RUNNER_TEMP/git-push-askpass.sh" GIT_TERMINAL_PROMPT=0 git push origin "HEAD:main"\nrm -f "$RUNNER_TEMP/git-push-askpass.sh"'''
          if old not in text:
              raise SystemExit('Pinned v3 commit step no longer contains expected push command')
          text = text.replace(old, new, 1)
          if '.github/workflows/apply-communications-autopilot-v4.yml' not in text:
              raise SystemExit('v4 installer was not added to staged-path allowlist')
          if 'git-push-askpass.sh' not in text:
              raise SystemExit('authenticated push patch was not applied')
          out = Path(__import__('os').environ['RUNNER_TEMP']) / 'v4-commit.sh'
          out.write_text(text, encoding='utf-8')
          PY
          bash -n "$RUNNER_TEMP/v4-commit.sh"
          bash "$RUNNER_TEMP/v4-commit.sh"

      - name: Publish validated APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/extract-v3-step.py" 'Publish validated APK prerelease' > "$RUNNER_TEMP/v3-publish.sh"
          sed -i 's/Communications Autopilot v3 installed/Communications Autopilot v4 installed/' "$RUNNER_TEMP/v3-publish.sh"
          bash "$RUNNER_TEMP/v3-publish.sh"
