[project]
name = "full-time-va-backend"
version = "1.0.2"
description = "Production backend for the Full-Time VA Android application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "httpx>=0.28,<1",
  "cryptography>=45,<47",
  "PyJWT[crypto]>=2.10,<3",
  "apscheduler>=3.11,<4",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-api-python-client>=2.170,<3",
  "beautifulsoup4>=4.13,<5",
  "PyMuPDF>=1.26,<2",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3",
  "tenacity>=9.1,<10",
  "firebase-admin>=6.9,<7",
  "feedparser>=6.0.11,<7",
  "paramiko>=3.5,<4",
  "PyNaCl>=1.5,<2",
  "playwright>=1.61,<2",
  "twilio>=9,<10"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1"
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
