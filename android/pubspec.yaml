name: full_time_va
description: Android control centre for the Full-Time VA automation service.
publish_to: none
version: 0.9.4+37
environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.2
  intl: ^0.20.3
  provider: ^6.1.5+1
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^22.2.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/connector_catalog.json
    - assets/app_icon.png
